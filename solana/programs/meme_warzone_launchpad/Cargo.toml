[package]
name = "meme_warzone_launchpad"
version = "0.1.0"
description = "MemeWarzone protected pre-grad launchpad program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meme_warzone_launchpad"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
proc-macro2 = { workspace = true }
serde_json = { workspace = true }
