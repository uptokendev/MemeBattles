[workspace]
members = [
  "programs/memewarzone_solana",
]
resolver = "2"

[workspace.dependencies]
anchor-lang = "0.30.1"
# Keep Anchor 0.30 / Solana 1.18 SBF builds on pre-edition-2024 crate
# manifests. The Solana SBF cargo path can be older than the shell cargo.
blake3 = "=1.5.5"
borsh = { version = "=1.5.7", features = ["derive"] }
proc-macro-crate = "=3.2.0"
indexmap = "=2.3.0"
hashbrown = "=0.14.5"
ahash = "=0.8.11"
ppv-lite86 = "=0.2.20"
zeroize = "=1.3.0"
zeroize_derive = "=1.4.2"
toml = "=0.8.23"
toml_datetime = "=0.6.11"
toml_edit = "=0.22.27"
crypto-common = "=0.1.7"
cpufeatures = "=0.2.17"

[profile.release]
overflow-checks = true
