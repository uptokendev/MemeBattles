[workspace]
members = [
  "programs/memewarzone_solana",
  "programs/mwz_rewards_treasury",
]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# Anchor 0.30 account constraints expand through token-interface and extension
# modules even though runtime execution is bound to the classic SPL Token program.
anchor-spl = { version = "0.30.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
# Keep Anchor 0.30 / Solana 1.18 SBF builds on pre-edition-2024 crates.
# proc-macro2 1.0.86 breaks host IDL generation on modern stable rustc
# (missing proc_macro::SourceFile); 1.0.94 works for both host IDL and SBF.
blake3 = "=1.5.5"
borsh = { version = "=1.5.7", features = ["derive"] }
proc-macro2 = "=1.0.94"
proc-macro-crate = "=3.2.0"
indexmap = "=2.7.0"
hashbrown = "=0.15.2"
ahash = "=0.8.11"
ppv-lite86 = "=0.2.20"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
cc = "=1.2.27"
jobserver = "=0.1.31"
unicode-segmentation = "=1.12.0"
zeroize = "=1.3.0"
zeroize_derive = "=1.4.2"
toml = "=0.8.23"
toml_datetime = "=0.6.11"
toml_edit = "=0.22.27"
crypto-common = "=0.1.7"
cpufeatures = "=0.2.17"

[profile.release]
overflow-checks = true
