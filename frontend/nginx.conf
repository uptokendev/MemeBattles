server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite chunks must 404, not fall through to the SPA.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React routes (/token/*, /war-room, /league, /profile/*, /create, …)
    # are not files. Serve index.html with 200, never 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
