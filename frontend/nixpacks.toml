[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
# Use npm install here because this hotfix adds a server-runtime image decoder.
# The committed lockfile can be regenerated on the next local dependency refresh;
# Railway must not fail deployment while the live share-card endpoint is broken.
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["node -e \"console.log('Skipping Vite build for Railway API gateway service')\""]

[start]
cmd = "npm run api:start"
