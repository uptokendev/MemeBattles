<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MemeWarzone — Draft Preview</title>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;padding:0;background:#1a1612;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="var-a.jsx"></script>
<script type="text/babel" src="var-b.jsx"></script>
<script type="text/babel" src="owner-view.jsx"></script>
<script type="text/babel" src="unfurls.jsx"></script>

<script type="text/babel">
const App = () => (
  <DesignCanvas>
    <DCSection id="public" title="Public draft preview" subtitle="What a visitor sees when the creator shares the link. Two directions: a tactical-dossier take and a cinematic war-room take.">
      <DCArtboard id="var-a" label="A · Recon Dossier (safe)" width={1280} height={2400} data-screen-label="Variation A · Public draft (safe)">
        <VarA/>
      </DCArtboard>
      <DCArtboard id="var-b" label="B · War Room Cinematic (bolder)" width={1280} height={2400} data-screen-label="Variation B · Public draft (bolder)">
        <VarB/>
      </DCArtboard>
    </DCSection>

    <DCSection id="owner" title="Creator owner view" subtitle="Same draft, edit mode. Inline-editable fields, drag-to-reorder sections, an 'Add section from template' library, and a side panel with deploy-readiness, traffic, and the share link.">
      <DCArtboard id="owner-view" label="Edit mode · Command Center" width={1480} height={1100} data-screen-label="Owner view · Edit mode">
        <OwnerView/>
      </DCArtboard>
    </DCSection>

    <DCSection id="unfurl" title="Social unfurl cards" subtitle="The OG-image that appears when the draft link is pasted into Telegram, X, or Discord. One card per direction, plus a contextual mock so you can see how each lands in-feed.">
      <DCArtboard id="unfurl-a" label="A · Dossier card (1200×630)" width={1200} height={630} data-screen-label="Unfurl A · Dossier">
        <UnfurlA/>
      </DCArtboard>
      <DCArtboard id="unfurl-b" label="B · Cinematic card (1200×630)" width={1200} height={630} data-screen-label="Unfurl B · Cinematic">
        <UnfurlB/>
      </DCArtboard>
      <DCArtboard id="unfurl-context" label="In context · TG + X feed" width={1200} height={620} data-screen-label="Unfurls in context">
        <UnfurlInContext/>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
