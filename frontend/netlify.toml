[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/no-functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' https://www.googletagmanager.com 'sha256-9dQG469HAOg+SZvXSF1aGN7kkDz07AiPt0ecQOkMA1E='; connect-src 'self' https: wss: https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self' data: blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Proxy /api/* to the Railway API gateway. Netlify must stay static-only (see AGENTS.md).
# Split services (per current production reality):
# - memebattles-production.up.railway.app : token data, summaries, metadata, indexer-style reads, some wallet connect/token flows.
# - memewarzonefrontend-production.up.railway.app : frontend-related flows (Command Center, War Room, drafts/Prepare, campaigns list, auth nonces for draft actions, promotion, etc.).
# The redirect target below is the fallback when no VITE_API_BASE* is set in the Netlify env.
# Most draft/campaign/auth traffic in prod uses the explicit base (unchanged envs) pointing at the frontend gateway.
[[redirects]]
  from = "/api/*"
  to = "https://memewarzonefrontend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
