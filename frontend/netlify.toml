[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Proxy /api/* to the Railway API gateway. Without this rule, relative API URLs
# in the rendered HTML (e.g. the prepare-share-card <img> src) fall through to
# the SPA catch-all below and render the 404 component. `force = true` makes
# this win over the static SPA fallback; status 200 keeps the browser URL on
# memewar.zone (proxy passthrough rather than HTTP redirect).
[[redirects]]
  from = "/api/*"
  to = "https://memewarzonefrontend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
