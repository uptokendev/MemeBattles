[build]
  # Netlify is a static frontend deploy. Contract compilation and ABI generation
  # run in the repository CI and the resulting frontend ABIs are committed.
  command = "npm run build"
  publish = "dist"
  functions = "netlify/no-functions"

[build.environment]
  # Vite, React SWC, PostCSS and Tailwind CSS are direct build-only
  # devDependencies. Include them even when the Netlify UI sets NODE_ENV=production.
  # frontend/.nvmrc is kept on the same Node 20 major used by repository CI.
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  VITE_ENABLE_WAR_ROOM = "true"
  VITE_ENABLE_POSTGRAD = "false"
  VITE_ENABLE_POSTGRAD_ARENA = "false"
  VITE_ENABLE_POSTGRAD_BATTLE = "false"
  VITE_ENABLE_POSTGRAD_EVENTS = "false"
  VITE_ENABLE_POSTGRAD_LEAGUE = "false"
  VITE_ENABLE_POSTGRAD_MOCKS = "false"
  VITE_ENABLE_POSTGRAD_TOURNAMENT = "false"
  VITE_ENABLE_DIRECT_BNB_DEPLOY = "true"
  VITE_LAUNCHPAD_WRITES_ENABLED = "true"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self'; connect-src 'self' https: wss:; media-src 'self' data: blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Social platforms fetch OG images cross-origin. Site-wide CORP:same-origin
# blocks many unfurls — open the dedicated OG asset (and prepare PNGs).
[[headers]]
  for = "/assets/og.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=86400, s-maxage=604800"
    Content-Type = "image/png"

[[headers]]
  for = "/assets/memewarzone.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=86400, s-maxage=604800"

# Social crawlers need to fetch prepare share-card PNGs (override site-wide CORP).
[[headers]]
  for = "/api/prepare-share-card"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=120, s-maxage=300"

[[headers]]
  for = "/api/prepare-og/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=60, s-maxage=120"

# Proxy /api/* to the Railway API gateway. Netlify should stay static-only;
# backend runtime, database writes, OpenAI, Ably, uploads, and private envs live
# on Railway. The empty functions directory above prevents Netlify from trying
# to package legacy netlify/functions as AWS Lambda functions, which can fail
# when the site environment exceeds Lambda's 4KB env limit.
[[redirects]]
  from = "/api/*"
  to = "https://memebattles-frontend-7dcf.up.railway.app/api/:splat"
  status = 200
  force = true

# Social crawlers for Prepare Mode: edge function serves dynamic OG HTML
# (twitter:image → /api/prepare-share-card?slug=…). Humans still get the SPA.
[[edge_functions]]
  function = "prepare-og"
  path = "/prepare/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
