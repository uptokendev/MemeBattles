<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemeWarzone</title>
    <meta name="description" content="The launchpad that turns every drop into a war. Create, promote, and launch memes on BNB Chain." />
    <meta name="author" content="MemeWarzone Launchpad" />

    <!--
      Default site OG/Twitter card (homepage + any SPA route without its own tags).
      Use /assets/og.png (1200x630) — not the large logo PNG — so social crawlers
      get a fast, correctly sized summary_large_image preview.
      ?v= busts stale X/Discord caches after meta changes.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MemeWarzone" />
    <meta property="og:url" content="https://app.memewar.zone/" />
    <meta property="og:title" content="MemeWarzone" />
    <meta property="og:description" content="The launchpad that turns every drop into a war. Create, promote, and launch memes on BNB Chain." />
    <meta property="og:image" content="https://app.memewar.zone/assets/og.png?v=2" />
    <meta property="og:image:secure_url" content="https://app.memewar.zone/assets/og.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MemeWarzone — meme launchpad on BNB Chain" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@memewarzone" />
    <meta name="twitter:creator" content="@memewarzone" />
    <meta name="twitter:title" content="MemeWarzone" />
    <meta name="twitter:description" content="The launchpad that turns every drop into a war. Create, promote, and launch memes on BNB Chain." />
    <meta name="twitter:image" content="https://app.memewar.zone/assets/og.png?v=2" />
    <meta name="twitter:image:alt" content="MemeWarzone — meme launchpad on BNB Chain" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!--
      IMPORTANT:
      Use a local favicon (served from /public) so deployments update correctly.
      The query string helps bust aggressive browser caching.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=mb1">

    <!-- Google tag (gtag.js). Initialization is self-hosted so CSP can remain strict. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C4MH8V5EHY"></script>
    <script src="/gtag-init.js"></script>

    <style>
      html, body {
        min-height: 100%;
        margin: 0;
        background: #010600;
        color: #39ff4f;
        font-family: "Press Start 2P", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      body {
        display: block;
      }

      #root {
        min-height: 100vh;
      }

      .mwz-html-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background:
          radial-gradient(circle at 50% 10%, rgba(57, 255, 79, 0.08), transparent 28%),
          radial-gradient(circle at 80% 80%, rgba(255, 153, 0, 0.08), transparent 32%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.86), rgba(0, 9, 0, 0.94));
      }

      .mwz-html-boot__title {
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .mwz-html-boot__status {
        margin-top: 18px;
        font-size: 11px;
        line-height: 1.8;
        letter-spacing: 0.05em;
        opacity: 0.84;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>

    <script>
      (function () {
        function setBootStatus(message) {
          var node = document.getElementById("mwz-html-boot-status");
          if (node) node.textContent = message;
        }

        window.__mwzSetBootStatus = setBootStatus;

        window.addEventListener("error", function (event) {
          var message = event && (event.message || (event.error && event.error.message)) || "Unknown browser error";
          setBootStatus("Browser error before app mount:\n" + message);
        });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          var message = (reason && reason.message) || String(reason || "Unknown rejected promise");
          setBootStatus("Unhandled promise before app mount:\n" + message);
        });
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div class="mwz-html-boot">
        <div>
          <div class="mwz-html-boot__title">Booting MemeWarzone...</div>
          <div id="mwz-html-boot-status" class="mwz-html-boot__status">Preparing local frontend...</div>
        </div>
      </div>
    </div>
    <noscript>
      <div class="mwz-html-boot">
        <div>
          <div class="mwz-html-boot__title">JavaScript is required</div>
          <div class="mwz-html-boot__status">Enable JavaScript to load MemeWarzone.</div>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
