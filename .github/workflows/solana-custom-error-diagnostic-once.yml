name: Extract one-shot Solana custom error

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/solana-custom-error-diagnostic-once.yml

permissions:
  actions: read
  contents: read

jobs:
  extract-error:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Download failed validator artifact
        uses: actions/download-artifact@v4
        with:
          name: memewarzone-solana-validator-172bb53e32a04d739bab598c26cd8d059e92d95d
          path: /tmp/validator-diagnostics
          run-id: 30383890584
          github-token: ${{ github.token }}

      - name: Print exact first failure and stage markers
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('/tmp/validator-diagnostics')
          log = next(root.rglob('solana-validator-acceptance.log'))
          lines = log.read_text(encoding='utf-8', errors='replace').splitlines()

          start = next(
              index
              for index, line in enumerate(lines)
              if line.strip().startswith('1) MemeWarzone Solana authorization')
          )
          end = next(
              (
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index].strip().startswith('2) MemeWarzone Solana authorization')
              ),
              min(len(lines), start + 120),
          )

          excerpt = lines[start:end]
          markers = [line.strip() for line in excerpt if 'MW_CREATE_STAGE_' in line]
          anchor_lines = [
              line.strip()
              for line in excerpt
              if 'AnchorError' in line
              or 'Error Code:' in line
              or 'Error Number:' in line
              or 'Error Message:' in line
              or 'Left:' in line
              or 'Right:' in line
          ]
          program_lines = [
              line.strip()
              for line in excerpt
              if 'Program log:' in line or 'failed:' in line
          ]

          diagnostic = {
              'markers': markers,
              'anchor_lines': anchor_lines,
              'program_lines': program_lines,
              'first_failure': excerpt,
          }
          print('MW_CUSTOM_ERROR_DIAGNOSTIC=' + json.dumps(diagnostic, ensure_ascii=True))
