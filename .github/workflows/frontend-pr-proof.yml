name: frontend pull request proof

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - frontend/**
      - scripts/apply-scheduled-draft-deploy-fix.mjs
      - .github/workflows/frontend-pr-proof.yml
      - .github/workflows/apply-scheduled-draft-deploy-fix.yml

permissions:
  contents: write

concurrency:
  group: frontend-pr-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  frontend:
    name: apply repair, frontend imports and production build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Repair and validate one-shot patch script
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/apply-scheduled-draft-deploy-fix.mjs';
          const source = fs.readFileSync(path, 'utf8');
          fs.writeFileSync(path, source.replace('} catch {}\\n}', '} catch {}\n}'));
          NODE
          node --check scripts/apply-scheduled-draft-deploy-fix.mjs

      - name: Apply scheduled draft repair
        run: node scripts/apply-scheduled-draft-deploy-fix.mjs

      - name: Restore permanent proof workflow
        shell: bash
        run: |
          git fetch origin devpostgrad --depth=1
          git show origin/devpostgrad:.github/workflows/frontend-pr-proof.yml > .github/workflows/frontend-pr-proof.yml

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check lifecycle API module syntax
        run: |
          node --check frontend/api/campaigns.js
          node --check frontend/api/campaigns-base.js
          node --check frontend/api/featured.js
          node --check frontend/api/dev-fix/drafts.js
          node --check frontend/api/dev-fix/drafts-base.js
          node --check frontend/api/dev-fix/draft-read.js
          node --check frontend/api/dev-fix/draft-read-base.js
          node --check frontend/api/dev-fix/draft-deploy.js
          node --check frontend/api/dev-fix/draft-deploy-base.js
          node --check frontend/api/dev-fix/json-transform.js
          node --check frontend/api/dev-fix/scheduled-lifecycle.js

      - name: Test scheduled lifecycle timestamp transitions
        run: node --test frontend/api/dev-fix/scheduled-lifecycle.test.mjs

      - name: Check API imports
        run: npm --prefix frontend run check:api-imports

      - name: Test wallet provider discovery
        run: npm --prefix frontend run test:wallet-discovery

      - name: Build public application
        run: npm --prefix frontend run build

      - name: Commit validated repair to pull request branch
        shell: bash
        run: |
          git diff --check
          git config user.name "MemeWarzone Build Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repair produced no changes."
            exit 1
          fi
          git commit -m "Fix scheduled draft cards, auth reads, and factory binding"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
