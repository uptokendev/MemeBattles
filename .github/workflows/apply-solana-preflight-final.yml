name: Apply Solana Preflight Final Patch

on:
  push:
    branches:
      - agent/solana-final-launch-blockers
    paths:
      - .github/solana-preflight-final-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solana-final-launch-blockers
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply preflight-first launch patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, repl):
              text = read(path)
              out, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected one match, found {count}: {pattern}")
              write(path, out)

