name: Apply Solana Preflight Final Patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply preflight-first launch patch
        shell: python
        run: |
          import runpy
          runpy.run_path(".github/scripts/run-solana-preflight-final.py", run_name="__main__")
