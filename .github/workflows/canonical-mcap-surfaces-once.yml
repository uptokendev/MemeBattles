name: Canonical MCap surfaces once

on:
  push:
    branches: [agent/canonical-mcap-surfaces]
    paths: [.github/workflows/canonical-mcap-surfaces-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-mcap-surfaces
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch MCap sources and chain-native USD conversion
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new, n=1):
              p=Path(path); t=p.read_text(); c=t.count(old)
              if c != n: raise SystemExit(f'{path}: expected {n}, found {c}: {old[:100]}')
              p.write_text(t.replace(old,new))

          # Home campaign grid: SOL uses SOL/USD, BNB uses BNB/USD. Canonical REST/on-chain
          # outranks legacy token_stats realtime patches so an Ably message cannot regress MCap.
          f='frontend/src/components/home/CampaignGrid.tsx'
          rep(f,'import { useBnbUsdPrice } from "@/hooks/useBnbUsdPrice";','import { useNativeUsdPrice } from "@/hooks/useNativeUsdPrice";')
          rep(f,'  const { price: bnbUsd } = useBnbUsdPrice(true);','  const { price: nativeUsd } = useNativeUsdPrice(activeChainId);')
          rep(f,'    bnbUsd: bnbUsd ? bnbUsd : null,','    // Legacy API key; value is USD per selected chain-native coin.\n    bnbUsd: nativeUsd ? nativeUsd : null,')
          rep(f,'  }), [activeChainId, query, bnbUsd, includeTestnet]);','  }), [activeChainId, query, nativeUsd, includeTestnet]);')
          rep(f,'        (patch?.marketcapBnb ?? onChain?.marketcapBnb ?? it.marketcapBnb) ?? NaN,\n      );\n      const mcapUsd = Number.isFinite(mcapBnb) && bnbUsd ? mcapBnb * bnbUsd : NaN;','        // Canonical REST/on-chain values outrank legacy token_stats realtime patches.\n        (onChain?.marketcapBnb ?? it.marketcapBnb ?? patch?.marketcapBnb) ?? NaN,\n      );\n      const mcapUsd = Number.isFinite(mcapBnb) && nativeUsd ? mcapBnb * nativeUsd : NaN;')
          rep(f,'      const athUsd = Number.isFinite(athBnb) && bnbUsd ? athBnb * bnbUsd : NaN;','      const athUsd = Number.isFinite(athBnb) && nativeUsd ? athBnb * nativeUsd : NaN;')
          rep(f,'  }, [items, bnbUsd, logoCache, patchByCampaign, onChainByCampaign, baseParams]);','  }, [items, nativeUsd, logoCache, patchByCampaign, onChainByCampaign, baseParams]);')

          # Featured cards: same chain-native USD conversion and canonical REST precedence.
          f='frontend/src/components/home/FeaturedCampaigns.tsx'
          rep(f,'import { useBnbUsdPrice } from "@/hooks/useBnbUsdPrice";','import { useNativeUsdPrice } from "@/hooks/useNativeUsdPrice";')
          rep(f,'  const { price: bnbUsd } = useBnbUsdPrice(true);','  const { price: nativeUsd } = useNativeUsdPrice(featuredChainId);')
          rep(f,'      const mcapBnb = Number((patch as { marketcapBnb?: string | number }).marketcapBnb ?? it.marketcapBnb ?? NaN);\n      const mcapUsdLabel = Number.isFinite(mcapBnb) && bnbUsd ? formatCompactUsd(mcapBnb * bnbUsd) : null;','      // Canonical REST value wins; legacy realtime marketcap is fallback only.\n      const mcapBnb = Number(it.marketcapBnb ?? (patch as { marketcapBnb?: string | number }).marketcapBnb ?? NaN);\n      const mcapUsdLabel = Number.isFinite(mcapBnb) && nativeUsd ? formatCompactUsd(mcapBnb * nativeUsd) : null;')
          rep(f,'  }, [items, patchByCampaign, bnbUsd, logoCache, voteMode, featuredChainId]);','  }, [items, patchByCampaign, nativeUsd, logoCache, voteMode, featuredChainId]);')

          # War Trade Room chart: BNB previously received no native/USD value at all.
          f='frontend/src/components/token/ContinuousMarketChartPanel.tsx'
          rep(f,'import { useSolUsdPrice } from "@/hooks/useSolUsdPrice";','import { useNativeUsdPrice } from "@/hooks/useNativeUsdPrice";')
          rep(f,'  const { price: solUsd } = useSolUsdPrice(solana);','  const { price: nativeUsd } = useNativeUsdPrice(chainId);')
          rep(f,'          nativeUsdPrice={solana ? solUsd : undefined}','          nativeUsdPrice={nativeUsd}')

          # Legacy carousel is still mounted in some layouts. Make its market-cap conversion
          # chain-aware as well so it cannot reintroduce SOL*BNB/USD.
          f='frontend/src/components/ui/horizontal-scroll-carousel.tsx'
          rep(f,'import { useBnbUsdPrice } from "@/hooks/useBnbUsdPrice";','import { useNativeUsdPrice } from "@/hooks/useNativeUsdPrice";')
          rep(f,'  const { price: bnbUsdPrice } = useBnbUsdPrice(true);','  const { price: nativeUsdPrice } = useNativeUsdPrice(chainIdForStorage);')
          rep(f,'            // Convert "X BNB" -> USD label for UI + ATH tracking\n            let marketCapUsdLabel: string | null = null;\n            const mcBnb = marketCapLabel.toUpperCase().includes("BNB")\n              ? parseCompactNumber(marketCapLabel.replace(/BNB/i, "").trim())\n              : null;\n            if (mcBnb != null && bnbUsdPrice && Number.isFinite(Number(bnbUsdPrice))) {\n              marketCapUsdLabel = formatCompactUsd(mcBnb * Number(bnbUsdPrice));\n            }','            // Convert the selected chain-native market cap (BNB or SOL) to USD.\n            let marketCapUsdLabel: string | null = null;\n            const nativeSymbol = isSolanaChainId(chainIdForStorage) ? "SOL" : "BNB";\n            const nativePattern = new RegExp(nativeSymbol, "i");\n            const mcNative = marketCapLabel.toUpperCase().includes(nativeSymbol)\n              ? parseCompactNumber(marketCapLabel.replace(nativePattern, "").trim())\n              : null;\n            if (mcNative != null && nativeUsdPrice && Number.isFinite(Number(nativeUsdPrice))) {\n              marketCapUsdLabel = formatCompactUsd(mcNative * Number(nativeUsdPrice));\n            }',1)
          rep(f,'  }, [fetchCampaigns, fetchCampaignCardStats, bnbUsdPrice]);','  }, [fetchCampaigns, fetchCampaignCardStats, nativeUsdPrice, chainIdForStorage]);')
          rep(f,'            let marketCapUsdLabel: string | null = null;\n            const mcBnb = marketCapLabel.toUpperCase().includes("BNB")\n              ? parseCompactNumber(marketCapLabel.replace(/BNB/i, "").trim())\n              : null;\n            if (mcBnb != null && bnbUsdPrice && Number.isFinite(Number(bnbUsdPrice))) {\n              marketCapUsdLabel = formatCompactUsd(mcBnb * Number(bnbUsdPrice));\n            }','            let marketCapUsdLabel: string | null = null;\n            const nativeSymbol = isSolanaChainId(chainIdForStorage) ? "SOL" : "BNB";\n            const nativePattern = new RegExp(nativeSymbol, "i");\n            const mcNative = marketCapLabel.toUpperCase().includes(nativeSymbol)\n              ? parseCompactNumber(marketCapLabel.replace(nativePattern, "").trim())\n              : null;\n            if (mcNative != null && nativeUsdPrice && Number.isFinite(Number(nativeUsdPrice))) {\n              marketCapUsdLabel = formatCompactUsd(mcNative * Number(nativeUsdPrice));\n            }',1)
          rep(f,'  }, [fetchCampaignCardStats, bnbUsdPrice]);','  }, [fetchCampaignCardStats, nativeUsdPrice, chainIdForStorage]);')

          # Campaign feed: canonical-v2 latest 5s price/MCap first, token_stats only fallback.
          p=Path('frontend/api/campaigns-base.js'); t=p.read_text()
          old='''          ts.last_price_bnb,\n          ts.sold_tokens,\n          ts.marketcap_bnb,'''
          new='''          coalesce(cc.price_c, ts.last_price_bnb) as last_price_bnb,\n          ts.sold_tokens,\n          coalesce(cc.mcap_c, ts.marketcap_bnb) as marketcap_bnb,'''
          if t.count(old)!=1: raise SystemExit(f'campaigns select count {t.count(old)}')
          t=t.replace(old,new,1)
          a='''        left join public.token_stats ts\n          on ts.chain_id = c.chain_id and ts.campaign_address = c.campaign_address\n'''
          j=a+'''        left join lateral (\n          select tc.price_c, tc.mcap_c\n          from public.token_candles tc\n          where tc.chain_id = c.chain_id\n            and tc.campaign_address = c.campaign_address\n            and tc.timeframe = '5s'\n            and coalesce(tc.canonical_version, 0) >= 2\n            and tc.price_c is not null\n            and tc.mcap_c is not null\n          order by tc.bucket_start desc\n          limit 1\n        ) cc on true\n'''
          if t.count(a)!=1: raise SystemExit(f'campaigns join count {t.count(a)}')
          t=t.replace(a,j,1)
          old_ath='''      ath as (\n        select\n          b.chain_id,\n          b.campaign_address,\n          max(tc.h) as ath_price_bnb\n        from base b\n        left join public.token_candles tc\n          on tc.chain_id = b.chain_id\n          and tc.campaign_address = b.campaign_address\n          and tc.timeframe = '1m'\n        group by b.chain_id, b.campaign_address\n      ),'''
          new_ath='''      ath as (\n        select\n          b.chain_id,\n          b.campaign_address,\n          max(tc.h) as ath_price_bnb,\n          max(tc.mcap_h) as ath_marketcap_bnb\n        from base b\n        left join public.token_candles tc\n          on tc.chain_id = b.chain_id\n          and tc.campaign_address = b.campaign_address\n          and tc.timeframe = '1m'\n        group by b.chain_id, b.campaign_address\n      ),'''
          if t.count(old_ath)!=1: raise SystemExit('campaigns ath CTE anchor missing')
          t=t.replace(old_ath,new_ath,1)
          old_case='''          case\n            when ath.ath_price_bnb is not null and b.sold_tokens is not null then ath.ath_price_bnb * b.sold_tokens\n            else b.marketcap_bnb\n          end as ath_marketcap_bnb,'''
          new_case='''          coalesce(\n            ath.ath_marketcap_bnb,\n            case when ath.ath_price_bnb is not null and b.sold_tokens is not null then ath.ath_price_bnb * b.sold_tokens end,\n            b.marketcap_bnb\n          ) as ath_marketcap_bnb,'''
          if t.count(old_case)!=1: raise SystemExit('campaigns ath case anchor missing')
          t=t.replace(old_case,new_case,1)
          p.write_text(t)

          # Featured API: same canonical latest close, including fallback ordering.
          p=Path('frontend/api/featured.js'); t=p.read_text()
          m='ts.marketcap_bnb AS "marketcapBnb"'
          if t.count(m)!=2: raise SystemExit(f'featured mcap count {t.count(m)}')
          t=t.replace(m,'COALESCE(cc.mcap_c, ts.marketcap_bnb) AS "marketcapBnb"')
          a='''     LEFT JOIN token_stats ts\n       ON ts.chain_id = c.chain_id\n      AND ts.campaign_address = c.campaign_address\n'''
          j=a+'''     LEFT JOIN LATERAL (\n       SELECT tc.mcap_c\n       FROM token_candles tc\n       WHERE tc.chain_id = c.chain_id\n         AND tc.campaign_address = c.campaign_address\n         AND tc.timeframe = '5s'\n         AND COALESCE(tc.canonical_version, 0) >= 2\n         AND tc.mcap_c IS NOT NULL\n       ORDER BY tc.bucket_start DESC\n       LIMIT 1\n     ) cc ON true\n'''
          if t.count(a)!=2: raise SystemExit(f'featured join count {t.count(a)}')
          t=t.replace(a,j)
          rep_order='''       COALESCE(ts.marketcap_bnb, 0) DESC,'''
          if t.count(rep_order)!=1: raise SystemExit('featured ordering anchor missing')
          t=t.replace(rep_order,'       COALESCE(cc.mcap_c, ts.marketcap_bnb, 0) DESC,',1)
          p.write_text(t)

          # TokenDetails BNB bonding: use the same live contract price * sold basis for the
          # ephemeral current chart bucket. Historical candles remain canonical/server-owned.
          p=Path('frontend/src/components/token/UnifiedMarketChart.tsx'); t=p.read_text()
          old='''    const hasGraduatedSolanaSpot =\n      solana &&\n      solanaGraduated &&\n      Number.isFinite(livePrice) &&\n      livePrice > 0 &&\n      (metric === "price" || (Number.isFinite(liveSupply) && liveSupply > 0)) &&\n      (denomination !== "USD" || nativeUsd > 0);\n\n    if (!hasHistoricalData && !hasGraduatedSolanaSpot) return [] as CandleRow[];'''
          new='''    const hasGraduatedSolanaSpot =\n      solana &&\n      solanaGraduated &&\n      Number.isFinite(livePrice) &&\n      livePrice > 0 &&\n      (metric === "price" || (Number.isFinite(liveSupply) && liveSupply > 0)) &&\n      (denomination !== "USD" || nativeUsd > 0);\n    const hasLiveBnbBondingSpot =\n      !solana &&\n      !isGraduatedStage(marketState) &&\n      Number.isFinite(livePrice) &&\n      livePrice > 0 &&\n      (metric === "price" || (Number.isFinite(liveSupply) && liveSupply > 0)) &&\n      (denomination !== "USD" || nativeUsd > 0);\n    const hasLiveSpotOverlay = hasGraduatedSolanaSpot || hasLiveBnbBondingSpot;\n\n    if (!hasHistoricalData && !hasLiveSpotOverlay) return [] as CandleRow[];'''
          if t.count(old)!=1: raise SystemExit('chart live spot gate anchor missing')
          t=t.replace(old,new,1)
          t=t.replace('''    if (!hasGraduatedSolanaSpot) return authoritative;''','''    if (!hasLiveSpotOverlay) return authoritative;''',1)
          t=t.replace('''    solanaGraduated,\n    tokenDecimals,''','''    solanaGraduated,\n    tokenDecimals,''',1)
          p.write_text(t)

      - name: Audit MCap source changes
        run: |
          ! grep -R "useBnbUsdPrice" frontend/src/components/home/CampaignGrid.tsx frontend/src/components/home/FeaturedCampaigns.tsx frontend/src/components/token/ContinuousMarketChartPanel.tsx frontend/src/components/ui/horizontal-scroll-carousel.tsx
          grep -q "useNativeUsdPrice" frontend/src/components/home/CampaignGrid.tsx
          grep -q "useNativeUsdPrice" frontend/src/components/home/FeaturedCampaigns.tsx
          grep -q "useNativeUsdPrice" frontend/src/components/token/ContinuousMarketChartPanel.tsx
          grep -q "canonical_version" frontend/api/campaigns-base.js
          grep -q "canonical_version" frontend/api/featured.js
          grep -q "hasLiveBnbBondingSpot" frontend/src/components/token/UnifiedMarketChart.tsx
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build and lint frontend
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run lint
      - name: Build realtime indexer
        run: |
          npm ci --prefix realtime-indexer
          npm --prefix realtime-indexer run build
      - name: Remove one-shot workflow
        run: git rm .github/workflows/canonical-mcap-surfaces-once.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/api/campaigns-base.js frontend/api/featured.js frontend/src/components/home/CampaignGrid.tsx frontend/src/components/home/FeaturedCampaigns.tsx frontend/src/components/token/ContinuousMarketChartPanel.tsx frontend/src/components/ui/horizontal-scroll-carousel.tsx frontend/src/components/token/UnifiedMarketChart.tsx
          git commit -m "Unify market cap across public surfaces"
          git push origin HEAD:agent/canonical-mcap-surfaces