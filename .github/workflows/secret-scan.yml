name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - dev
      - devpostgrad
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked environment files
        shell: bash
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '\.example$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Tracked environment files are forbidden:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Reject server secrets in browser source
        shell: bash
        run: |
          if grep -RInE --exclude-dir=node_modules --exclude-dir=dist \
            '(SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|PRIVATE_KEY|MNEMONIC|ABLY_API_KEY|DISCORD_BOT_TOKEN|TELEGRAM_BOT_TOKEN)' \
            frontend/src 2>/dev/null; then
            echo "Server-only secret name found in browser source."
            exit 1
          fi

  gitleaks:
    name: gitleaks full history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
