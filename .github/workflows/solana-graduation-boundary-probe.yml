name: Solana Graduation Boundary Probe

on:
  push:
    branches:
      - hotfix/solana-mainnet-transaction-normalization
    paths:
      - .github/workflows/solana-graduation-boundary-probe.yml
      - programs/memewarzone_solana/src/graduation.rs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/solana-graduation-boundary-probe.yml
      - programs/memewarzone_solana/src/graduation.rs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-graduation-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANCHOR_VERSION: 0.30.1
  SOLANA_VERSION: 1.18.26
  AGAVE_VERSION: 4.2.0
  RUST_TOOLCHAIN: 1.79.0
  IDL_RUST_TOOLCHAIN: nightly-2024-05-09
  ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
  MAINNET_RPC: https://api.mainnet-beta.solana.com
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt

jobs:
  snapshot:
    name: Prove raw graduation Campaign snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install frozen Solana build CLI
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Agave runtime
        shell: bash
        run: |
          set -euo pipefail
          agave_dir="$RUNNER_TEMP/agave-v${AGAVE_VERSION}"
          mkdir -p "$agave_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/agave-release.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/v${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/agave-release.tar.bz2 -C "$agave_dir" --strip-components=1
          echo "AGAVE_BIN=$agave_dir/bin" >> "$GITHUB_ENV"
          "$agave_dir/bin/solana-test-validator" --version
      - name: Install Anchor CLI
        run: npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
      - name: Apply graduation snapshot candidate when needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('programs/memewarzone_solana/src/graduation.rs')
          source = path.read_text(encoding='utf-8')
          if 'struct GraduationCampaignSnapshot {' in source:
              print('graduation snapshot already committed; testing exact source')
              raise SystemExit(0)

          anchor = 'const MAX_ATOMIC_SCAN_INSTRUCTIONS: usize = 48;\n'
          if source.count(anchor) != 1:
              raise SystemExit('snapshot insertion anchor not unique')
          snapshot = r'''

// Full Campaign deserialization exceeds the effective Mainnet Agave SBF stack
// even though the old local validator accepts it. Graduation only needs this
// bounded subset, so read the fixed Borsh fields directly from the 720-byte account.
#[derive(Clone, Copy)]
struct GraduationCampaignSnapshot {
    campaign_id: [u8; 32],
    generation_id: [u8; 32],
    generation_config: Pubkey,
    creator: Pubkey,
    mint: Pubkey,
    token_vault: Pubkey,
    sol_vault: Pubkey,
    graduation_target_usd_micros: u64,
    economics_version: u16,
    curve_token_supply: u64,
    liquidity_token_supply: u64,
    reserve_token_supply: u64,
    token_decimals: u8,
    base_price_lamports: u64,
    price_slope_lamports: u64,
    finalize_fee_bps: u16,
    liquidity_post_finalize_bps: u16,
    dex_adapter: u8,
    sold_tokens: u64,
    net_raised_lamports: u64,
    graduated: bool,
    paused: bool,
    bump: u8,
}

const GRAD_CAMPAIGN_ACCOUNT_BYTES: usize = 720;
const GRAD_CAMPAIGN_GRADUATED_OFFSET: usize = 713;

fn grad_campaign_range<'a>(data: &'a [u8], offset: usize, len: usize) -> Result<&'a [u8]> {
    let end = offset.checked_add(len).ok_or(LaunchpadError::MathOverflow)?;
    require!(end <= data.len(), LaunchpadError::InvalidCampaign);
    Ok(&data[offset..end])
}
fn grad_campaign_u8(data: &[u8], offset: usize) -> Result<u8> {
    Ok(*grad_campaign_range(data, offset, 1)?.first().ok_or(LaunchpadError::InvalidCampaign)?)
}
fn grad_campaign_bool(data: &[u8], offset: usize) -> Result<bool> {
    let value = grad_campaign_u8(data, offset)?;
    require!(value <= 1, LaunchpadError::InvalidCampaign);
    Ok(value == 1)
}
fn grad_campaign_u16(data: &[u8], offset: usize) -> Result<u16> {
    let raw = grad_campaign_range(data, offset, 2)?;
    Ok(u16::from_le_bytes([raw[0], raw[1]]))
}
fn grad_campaign_u64(data: &[u8], offset: usize) -> Result<u64> {
    let raw = grad_campaign_range(data, offset, 8)?;
    Ok(u64::from_le_bytes(raw.try_into().map_err(|_| error!(LaunchpadError::InvalidCampaign))?))
}
fn grad_campaign_32(data: &[u8], offset: usize) -> Result<[u8; 32]> {
    grad_campaign_range(data, offset, 32)?.try_into().map_err(|_| error!(LaunchpadError::InvalidCampaign))
}
fn grad_campaign_pubkey(data: &[u8], offset: usize) -> Result<Pubkey> {
    Ok(Pubkey::new_from_array(grad_campaign_32(data, offset)?))
}
fn grad_assert_campaign_data(data: &[u8]) -> Result<()> {
    require!(data.len() >= GRAD_CAMPAIGN_ACCOUNT_BYTES, LaunchpadError::InvalidCampaign);
    require!(
        data.get(..8) == Some(<Campaign as anchor_lang::Discriminator>::DISCRIMINATOR.as_ref()),
        LaunchpadError::InvalidCampaign
    );
    Ok(())
}
#[inline(never)]
fn load_graduation_campaign_snapshot(info: &AccountInfo) -> Result<GraduationCampaignSnapshot> {
    require_keys_eq!(*info.owner, crate::ID, LaunchpadError::InvalidCampaign);
    let data = info.try_borrow_data()?;
    grad_assert_campaign_data(&data)?;
    Ok(GraduationCampaignSnapshot {
        campaign_id: grad_campaign_32(&data, 8)?,
        generation_id: grad_campaign_32(&data, 40)?,
        generation_config: grad_campaign_pubkey(&data, 72)?,
        creator: grad_campaign_pubkey(&data, 136)?,
        mint: grad_campaign_pubkey(&data, 168)?,
        token_vault: grad_campaign_pubkey(&data, 200)?,
        sol_vault: grad_campaign_pubkey(&data, 232)?,
        graduation_target_usd_micros: grad_campaign_u64(&data, 408)?,
        economics_version: grad_campaign_u16(&data, 417)?,
        curve_token_supply: grad_campaign_u64(&data, 428)?,
        liquidity_token_supply: grad_campaign_u64(&data, 436)?,
        reserve_token_supply: grad_campaign_u64(&data, 444)?,
        token_decimals: grad_campaign_u8(&data, 452)?,
        base_price_lamports: grad_campaign_u64(&data, 457)?,
        price_slope_lamports: grad_campaign_u64(&data, 465)?,
        finalize_fee_bps: grad_campaign_u16(&data, 477)?,
        liquidity_post_finalize_bps: grad_campaign_u16(&data, 481)?,
        dex_adapter: grad_campaign_u8(&data, 483)?,
        sold_tokens: grad_campaign_u64(&data, 662)?,
        net_raised_lamports: grad_campaign_u64(&data, 670)?,
        graduated: grad_campaign_bool(&data, GRAD_CAMPAIGN_GRADUATED_OFFSET)?,
        paused: grad_campaign_bool(&data, 715)?,
        bump: grad_campaign_u8(&data, 716)?,
    })
}
#[inline(never)]
fn mark_campaign_graduated(info: &AccountInfo) -> Result<()> {
    require_keys_eq!(*info.owner, crate::ID, LaunchpadError::InvalidCampaign);
    let mut data = info.try_borrow_mut_data()?;
    grad_assert_campaign_data(&data)?;
    require!(GRAD_CAMPAIGN_GRADUATED_OFFSET < data.len(), LaunchpadError::InvalidCampaign);
    data[GRAD_CAMPAIGN_GRADUATED_OFFSET] = 1;
    Ok(())
}
'''
          source = source.replace(anchor, anchor + snapshot, 1)
          replacements = [
              ('let campaign = load_campaign(&ctx.accounts.campaign.to_account_info())?;', 'let campaign = load_graduation_campaign_snapshot(&ctx.accounts.campaign.to_account_info())?;', 1),
              ('let mut campaign = load_campaign(&ctx.accounts.campaign.to_account_info())?;', 'let campaign = load_graduation_campaign_snapshot(&ctx.accounts.campaign.to_account_info())?;', 1),
              ('fn validate_generation_binding(campaign: &Campaign, generation_info: &AccountInfo) -> Result<()> {', 'fn validate_generation_binding(campaign: &GraduationCampaignSnapshot, generation_info: &AccountInfo) -> Result<()> {', 1),
              ('fn validate_campaign_accounts(\n    campaign: &Campaign,', 'fn validate_campaign_accounts(\n    campaign: &GraduationCampaignSnapshot,', 1),
              ('    let quote = graduation_quote(&campaign)?;', '    let quote = graduation_quote_snapshot(&campaign)?;', 1),
              ('    campaign.graduated = true;\n    store_campaign(&ctx.accounts.campaign.to_account_info(), &campaign)?;', '    mark_campaign_graduated(&ctx.accounts.campaign.to_account_info())?;', 1),
          ]
          for old, new, expected in replacements:
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'candidate target mismatch: expected {expected}, found {count}: {old[:100]!r}')
              source = source.replace(old, new, expected)

          quote_anchor = 'pub fn final_spot_nano_lamports(campaign: &Campaign) -> Result<u128> {'
          if source.count(quote_anchor) != 1:
              raise SystemExit('quote insertion anchor not unique')
          quote_code = r'''
fn final_spot_nano_lamports_snapshot(campaign: &GraduationCampaignSnapshot) -> Result<u128> {
    require!(campaign.economics_version >= ECONOMICS_VERSION_V3, LaunchpadError::InvalidGenerationEconomics);
    let scale = token_scale(campaign.token_decimals)?;
    let base = u128::from(campaign.base_price_lamports)
        .checked_mul(SLOPE_NANO_LAMPORT_SCALE).ok_or(LaunchpadError::MathOverflow)?;
    let slope = u128::from(campaign.price_slope_lamports)
        .checked_mul(u128::from(campaign.sold_tokens)).ok_or(LaunchpadError::MathOverflow)?
        .checked_div(scale).ok_or(LaunchpadError::MathOverflow)?;
    base.checked_add(slope).ok_or_else(|| error!(LaunchpadError::MathOverflow))
}
fn graduation_quote_snapshot(campaign: &GraduationCampaignSnapshot) -> Result<GraduationQuote> {
    let spot = final_spot_nano_lamports_snapshot(campaign)?;
    require!(spot > 0, LaunchpadError::GraduationLiquidityZero);
    let finalize_fee = bps_amount(campaign.net_raised_lamports, campaign.finalize_fee_bps)?;
    let remaining = campaign.net_raised_lamports.checked_sub(finalize_fee).ok_or(LaunchpadError::MathOverflow)?;
    let target_liquidity = bps_amount(remaining, campaign.liquidity_post_finalize_bps)?;
    require!(target_liquidity > 0, LaunchpadError::GraduationLiquidityZero);
    let scale = token_scale(campaign.token_decimals)?;
    let desired_tokens = u128::from(target_liquidity)
        .checked_mul(scale).ok_or(LaunchpadError::MathOverflow)?
        .checked_mul(SLOPE_NANO_LAMPORT_SCALE).ok_or(LaunchpadError::MathOverflow)?
        .checked_div(spot).ok_or(LaunchpadError::MathOverflow)?;
    let max_tokens = desired_tokens.min(u128::from(campaign.liquidity_token_supply));
    require!(max_tokens > 0, LaunchpadError::GraduationLiquidityZero);
    let max_tokens_u64 = u64::try_from(max_tokens).map_err(|_| error!(LaunchpadError::MathOverflow))?;
    let liquidity_lamports = if desired_tokens <= u128::from(campaign.liquidity_token_supply) {
        target_liquidity
    } else {
        let used = max_tokens.checked_mul(spot).ok_or(LaunchpadError::MathOverflow)?
            .checked_div(scale.checked_mul(SLOPE_NANO_LAMPORT_SCALE).ok_or(LaunchpadError::MathOverflow)?)
            .ok_or(LaunchpadError::MathOverflow)?;
        u64::try_from(used).map_err(|_| error!(LaunchpadError::MathOverflow))?
    };
    require!(liquidity_lamports > 0, LaunchpadError::GraduationLiquidityZero);
    let creator_payout = remaining.checked_sub(liquidity_lamports).ok_or(LaunchpadError::MathOverflow)?;
    Ok(GraduationQuote {
        finalize_fee_lamports: finalize_fee,
        max_liquidity_lamports: liquidity_lamports,
        max_liquidity_tokens: max_tokens_u64,
        creator_payout_lamports: creator_payout,
        final_spot_nano_lamports: spot,
    })
}

'''
          source = source.replace(quote_anchor, quote_code + quote_anchor, 1)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          git diff -- programs/memewarzone_solana/src/graduation.rs
      - name: Create ephemeral payer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"
      - name: Build snapshot candidate
        shell: bash
        run: |
          set -o pipefail
          anchor build --program-name memewarzone_solana --no-idl \
            2>&1 | tee /tmp/mwz-grad-snapshot-build.log | tail -n 180
          test -s target/deploy/memewarzone_solana.so
          sha256sum target/deploy/memewarzone_solana.so | tee /tmp/mwz-grad-snapshot-sha.txt
          wc -c target/deploy/memewarzone_solana.so | tee /tmp/mwz-grad-snapshot-bytes.txt
      - name: Generate matching IDL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/idl
          ( cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json )
      - name: Install acceptance dependencies
        run: npm install --prefix tests/solana --no-audit --no-fund
      - name: Run full lifecycle on Mainnet Agave
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mwz-grad-snapshot-ledger
          "$AGAVE_BIN/solana-test-validator" \
            --reset \
            --quiet \
            --ledger /tmp/mwz-grad-snapshot-ledger \
            --url "$MAINNET_RPC" \
            --clone-feature-set \
            --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so \
            > /tmp/mwz-grad-snapshot-validator.log 2>&1 &
          validator_pid=$!
          trap 'kill "$validator_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if "$AGAVE_BIN/solana" cluster-version --url "$ANCHOR_PROVIDER_URL" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 120 ]; then tail -n 240 /tmp/mwz-grad-snapshot-validator.log >&2; exit 1; fi
            sleep 2
          done
          "$AGAVE_BIN/solana" config set --url "$ANCHOR_PROVIDER_URL" --keypair "$ANCHOR_WALLET" >/dev/null
          "$AGAVE_BIN/solana" airdrop 100 >/dev/null
          ( cd tests/solana && ANCHOR_PROVIDER_URL="$ANCHOR_PROVIDER_URL" ANCHOR_WALLET="$ANCHOR_WALLET" npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs ) \
            2>&1 | tee /tmp/mwz-grad-snapshot-acceptance.log
      - name: Persist proven graduation source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- programs/memewarzone_solana/src/graduation.rs; then
            echo 'Graduation snapshot already committed; no source write needed.'
            exit 0
          fi
          git diff --check
          git config user.name 'MemeWarzone Launch Bot'
          git config user.email 'launch-bot@users.noreply.github.com'
          git add -- programs/memewarzone_solana/src/graduation.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Fix Solana graduation Campaign stack overflow'
          git push origin HEAD:hotfix/solana-mainnet-transaction-normalization
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-graduation-snapshot-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/mwz-grad-snapshot-build.log
            /tmp/mwz-grad-snapshot-sha.txt
            /tmp/mwz-grad-snapshot-bytes.txt
            /tmp/mwz-grad-snapshot-validator.log
            /tmp/mwz-grad-snapshot-acceptance.log
            target/deploy/memewarzone_solana.so
