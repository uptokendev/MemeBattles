name: Agent creator tooltip side

on:
  push:
    branches:
      - agent/creator-tooltip-side
    paths:
      - .github/workflows/agent-creator-tooltip-side.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creator-tooltip-side
          fetch-depth: 0

      - name: Move creator tooltip beside marker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/token/UnifiedMarketChart.tsx')
          text = p.read_text(encoding='utf-8')
          old = '''              className="pointer-events-auto absolute z-30 w-[228px] -translate-x-1/2 rounded-xl border border-orange-400/45 bg-[#120a04]/97 p-2.5 shadow-[0_12px_40px_rgba(0,0,0,0.6)] backdrop-blur-sm"
              style={{ left: Math.min(Math.max(hoverPin.x, 114), (overlayRef.current?.clientWidth || 400) - 114), top: Math.max(8, hoverPin.y - 124) }}'''
          new = '''              className="pointer-events-auto absolute z-30 w-[228px] rounded-xl border border-orange-400/45 bg-[#120a04]/97 p-2.5 shadow-[0_12px_40px_rgba(0,0,0,0.6)] backdrop-blur-sm"
              style={{
                left:
                  hoverPin.x + 16 + 228 <= (overlayRef.current?.clientWidth || 400) - 8
                    ? hoverPin.x + 16
                    : Math.max(8, hoverPin.x - 16 - 228),
                top: Math.max(
                  8,
                  Math.min(
                    hoverPin.y - 24,
                    Math.max(8, (overlayRef.current?.clientHeight || 320) - 210),
                  ),
                ),
              }}'''
          if old not in text:
              raise SystemExit('creator tooltip anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Commit product fix and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/token/UnifiedMarketChart.tsx
          git rm .github/workflows/agent-creator-tooltip-side.yml
          git commit -m "Place creator trade tooltip beside marker"
          git push origin HEAD:agent/creator-tooltip-side
