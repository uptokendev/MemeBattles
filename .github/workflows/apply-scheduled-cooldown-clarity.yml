name: Clean scheduled cooldown clarity branch

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/apply-scheduled-cooldown-clarity.yml
      - frontend/yarn.lock

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-scheduled-cooldown
          fetch-depth: 0

      - name: Restore lockfile and remove temporary workflow
        run: |
          git fetch origin devpostgrad
          git checkout origin/devpostgrad -- frontend/yarn.lock
          rm .github/workflows/apply-scheduled-cooldown-clarity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean scheduled cooldown clarity branch"
          git push origin HEAD:agent/clarify-scheduled-cooldown
