name: Ticker Reservation Cluster Scope V3

on:
  pull_request:
    branches:
      - agent/scheduled-launch-lifecycle
      - devpostgrad
    paths:
      - scripts/apply-ticker-cluster-scope.py
      - .github/workflows/ticker-reservation-cluster-scope-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-ticker-reservations
          fetch-depth: 0

      - name: Validate deterministic patch script
        run: python -m py_compile scripts/apply-ticker-cluster-scope.py

      - name: Narrow canonical blocked-response matcher
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/apply-ticker-cluster-scope.py')
          source = path.read_text(encoding='utf-8')
          old = '''    source = replace_once(
                  source,
                  '''      ticker,
                chainId,
                available: false,''',
                  '''      ticker,
                chainId,
                cluster: result.cluster,
                available: false,''',
                  "blocked response cluster",
              )'''
          new = '''    source = replace_once(
                  source,
                  '''    return json(res, 200, {
                ticker,
                chainId,
                available: false,
                reason: blockedReason(result.reservation?.status),''',
                  '''    return json(res, 200, {
                ticker,
                chainId,
                cluster: result.cluster,
                available: false,
                reason: blockedReason(result.reservation?.status),''',
                  "blocked response cluster",
              )'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one generic blocked-response matcher, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Apply cluster-scoped reservation source
        run: python scripts/apply-ticker-cluster-scope.py

      - name: Verify patched sources
        shell: bash
        run: |
          node --check frontend/api/dev-fix/ticker-reservation-service.js
          node --check frontend/api/dev-fix/ticker-availability.js
          node --check frontend/api/dev-fix/ticker-reservations.js
          node --test frontend/api/dev-fix/ticker-reservation-service.test.mjs
          git diff --check
          git diff --stat

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/api/dev-fix/ticker-reservation-service.js \
            frontend/api/dev-fix/ticker-availability.js \
            frontend/api/dev-fix/ticker-reservations.js \
            frontend/src/lib/draftApi.ts \
            frontend/api/dev-fix/ticker-reservation-service.test.mjs
          git commit -m 'Scope ticker reservations by chain cluster'
          git push origin HEAD:agent/solana-v2-ticker-reservations
