name: Creator arm cooldown correction

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - "contracts/**"
      - "test/**"
      - "frontend/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/creator-arm-cooldown-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run size

  frontend-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --check api/dev-fix/security-current-time.js
        working-directory: frontend
      - run: node --check api/dev-fix/draft-deploy-base.js
        working-directory: frontend
      - run: node --check api/dev-fix/draft-deploy.js
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
