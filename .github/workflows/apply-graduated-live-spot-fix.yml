name: Apply graduated live spot fix

on:
  push:
    branches:
      - agent/fix-graduated-live-spot-candle

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-graduated-live-spot-candle
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply live spot patch
        run: |
          if grep -q 'hasGraduatedSolanaSpot' frontend/src/components/token/UnifiedMarketChart.tsx; then
            echo 'Patch already present.'
          else
            python3 scripts/apply_graduated_live_spot_fix.py
          fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/token/UnifiedMarketChart.tsx
          git commit -m '[graduated-live-spot-applied] Keep Meteora chart aligned with live spot'
          git push origin HEAD:agent/fix-graduated-live-spot-candle
