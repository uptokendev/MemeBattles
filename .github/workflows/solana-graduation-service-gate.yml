name: Solana graduation service gate

on:
  push:
    branches:
      - agent/solana-graduation-meteora-work
    paths:
      - .github/workflows/solana-graduation-service-gate.yml
      - scripts/solana/finalize-graduation-service.mjs

permissions:
  contents: write

jobs:
  graduation-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply asserted server transform
        run: node scripts/solana/finalize-graduation-service.mjs

      - name: Syntax checks
        run: |
          node --check frontend/api/dev-fix/solana-graduation-authorization-v1.js
          node --check frontend/api/server.mjs

      - name: Assert diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/grad-service-files.txt
          cat /tmp/grad-service-files.txt
          test "$(wc -l < /tmp/grad-service-files.txt)" -eq 1
          grep -qx 'frontend/api/server.mjs' /tmp/grad-service-files.txt

      - name: Frontend build
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm --prefix frontend run build

      - name: Commit gated server route
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/api/server.mjs
          git commit -m "feat(solana): expose graduation authorization route"
          git push origin HEAD:agent/solana-graduation-meteora-work
