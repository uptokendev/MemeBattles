name: Apply legacy trade UI patch

on:
  push:
    branches:
      - agent/fix-legacy-trade-history-recovery
    paths:
      - .github/workflows/apply-legacy-trade-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-legacy-trade-history-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic source patch
        run: node scripts/apply-legacy-trade-ui-patch.mjs
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/TokenDetails.tsx; then
            echo "No source changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/TokenDetails.tsx
          git commit -m "Show precise tiny BNB trade quotes"
          git push origin HEAD:agent/fix-legacy-trade-history-recovery
