name: Apply showcase testing fixes

on:
  push:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/fix-showcase-testing-issues.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-showcase-testing-issues
  cancel-in-progress: false

jobs:
  patch-build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout devpostgrad
        uses: actions/checkout@v4
        with:
          ref: devpostgrad
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply focused fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          dialog = "frontend/src/components/token/CreatorProtectionDialog.tsx"
          replace_once(
              dialog,
              '''  const openTierRules = () => {
              window.dispatchEvent(new CustomEvent("mwz:openTokenSafety"));
              setDetail(null);
            };

          ''',
              '''  const tierRules = [
              { tier: 1, name: "New", lock: "24 hours", cap: "0.25 BNB" },
              { tier: 2, name: "Trusted", lock: "6 hours", cap: "1 BNB" },
              { tier: 3, name: "Proven", lock: "1 hour", cap: "3 BNB" },
            ];

          ''',
          )
          replace_once(
              dialog,
              '''            {copy.note ? <span className="block rounded-xl border border-border/60 bg-muted/20 p-3 text-foreground/85">{copy.note}</span> : null}
          </DialogDescription>
        </DialogHeader>
        <DialogFooter className="gap-2 sm:gap-2">
          <Button type="button" variant="secondary" onClick={openTierRules}>View Tier Rules</Button>
          <Button type="button" onClick={() => setDetail(null)}>Understood</Button>
        </DialogFooter>''',
              '''            {copy.note ? <span className="block rounded-xl border border-border/60 bg-muted/20 p-3 text-foreground/85">{copy.note}</span> : null}
            <span className="block rounded-xl border border-amber-500/25 bg-black/30 p-3">
              <span className="mb-2 block text-xs font-semibold uppercase tracking-[0.14em] text-amber-300">Creator protection rules</span>
              <span className="grid gap-2">
                {tierRules.map((rule) => {
                  const active = Number(detail?.tierNumber || 1) === rule.tier;
                  return (
                    <span key={rule.tier} className={`grid grid-cols-[auto_1fr] gap-x-3 rounded-lg border px-3 py-2 ${active ? "border-amber-400/60 bg-amber-500/10 text-foreground" : "border-border/45 bg-muted/10 text-muted-foreground"}`}>
                      <span className="font-semibold">Tier {rule.tier}</span>
                      <span>{rule.name}: {rule.lock} buy lock, then {rule.cap} shared creator-cluster cap.</span>
                    </span>
                  );
                })}
              </span>
              <span className="mt-2 block text-xs text-muted-foreground">These limits apply only to the creator's own campaign. Linked wallets can trade unrelated campaigns normally.</span>
            </span>
          </DialogDescription>
        </DialogHeader>
        <DialogFooter>
          <Button type="button" onClick={() => setDetail(null)}>Understood</Button>
        </DialogFooter>''',
          )
          replace_once(dialog, 'className="max-w-md border-amber-500/35 bg-card/95 backdrop-blur-xl"', 'className="max-h-[90vh] max-w-lg overflow-y-auto border-amber-500/35 bg-card/95 backdrop-blur-xl"')

          grid = "frontend/src/components/home/CampaignGrid.tsx"
          replace_once(
              grid,
              '''function matchesSearch(item: CampaignFeedItemApi, search: unknown) {
            const q = normalizeSearch(search);
            if (!q) return true;
            return [item.name, item.symbol, item.campaignAddress, item.tokenAddress, item.creatorAddress]
              .map((v) => String(v ?? "").toLowerCase())
              .some((v) => v.includes(q));
          }

          ''',
              '''function matchesSearch(item: CampaignFeedItemApi, search: unknown) {
            const q = normalizeSearch(search);
            if (!q) return true;
            return [item.name, item.symbol, item.campaignAddress, item.tokenAddress, item.creatorAddress]
              .map((v) => String(v ?? "").toLowerCase())
              .some((v) => v.includes(q));
          }

          function hasUsableCampaignImage(value: unknown) {
            const raw = String(value ?? "").trim();
            return Boolean(raw && raw !== "/placeholder.svg" && raw !== "-");
          }

          function requiresIndexedGraduationState(params: Record<string, any>) {
            return String(params.tab || "").toLowerCase() === "dex" || String(params.status || "").toLowerCase() === "graduated";
          }

          ''',
          )
          replace_once(
              grid,
              '''    if (items.length < Number(params.limit || 24)) {
              const fallback = await fetchOnChainCampaignFeed(params);''',
              '''    if (items.length < Number(params.limit || 24) && !requiresIndexedGraduationState(params)) {
              const fallback = await fetchOnChainCampaignFeed(params);''',
          )
          replace_once(
              grid,
              '''  } catch (error) {
            console.warn("[CampaignGrid] realtime campaign feed failed; using on-chain factory fallback", error);
            return await fetchOnChainCampaignFeed(params);
          }''',
              '''  } catch (error) {
            if (requiresIndexedGraduationState(params)) throw error;
            console.warn("[CampaignGrid] realtime campaign feed failed; using on-chain factory fallback", error);
            return await fetchOnChainCampaignFeed(params);
          }''',
          )
          replace_once(grid, '        return !found?.logoUri;', '        return !hasUsableCampaignImage(found?.logoUri);')
          replace_once(grid, '      const rawLogo = it.logoUri || logoCache[addr] || null;', '      const rawLogo = hasUsableCampaignImage(it.logoUri) ? it.logoUri : logoCache[addr] || null;')

          featured = "frontend/src/components/home/FeaturedCampaigns.tsx"
          replace_once(
              featured,
              '''function isEvmAddress(addr?: string | null) {
            return /^0x[a-fA-F0-9]{40}$/.test(String(addr ?? "").trim());
          }

          ''',
              '''function isEvmAddress(addr?: string | null) {
            return /^0x[a-fA-F0-9]{40}$/.test(String(addr ?? "").trim());
          }

          function hasUsableFeaturedImage(value: unknown) {
            const raw = String(value ?? "").trim();
            return Boolean(raw && raw !== "/placeholder.svg" && raw !== "-");
          }

          function isLiveFeaturedItem(item: FeaturedItemApi) {
            return !item.graduatedAtChain && !item.isDexTrading;
          }

          ''',
          )
          replace_once(featured, '  graduatedAtChain?: string | null;\n  votes24h?: number | null;', '  graduatedAtChain?: string | null;\n  isDexTrading?: boolean;\n  votes24h?: number | null;')
          replace_once(featured, '    graduatedAtChain: src.graduatedAtChain ?? src.graduated_at_chain ?? null,\n    votes24h:', '    graduatedAtChain: src.graduatedAtChain ?? src.graduated_at_chain ?? null,\n    isDexTrading: Boolean(src.isDexTrading ?? src.is_dex_trading ?? src.status === "graduated"),\n    votes24h:')
          replace_once(featured, '    params.set("status", "all");', '    params.set("status", "live");')
          replace_once(featured, '    params.set("includeDrafts", "true");\n    params.set("status", "all");', '    params.set("includeDrafts", "true");')
          replace_once(
              featured,
              '''async function fetchFeaturedItems(chainId: number, refetchNonce: number): Promise<FeaturedItemApi[]> {
            const campaigns = await apiFetch(`/api/campaigns?${buildFeedQuery(chainId, refetchNonce, "campaigns")}`, { cache: "no-store" as RequestCache });
            const campaignJson = await campaigns.json().catch(() => null);
            const campaignItems = getResponseItems(campaignJson);
            const normalizedCampaigns = campaignItems.map(normalizeFeaturedItem).filter(Boolean) as FeaturedItemApi[];
            const onChain = await fetchOnChainFeaturedItems(chainId);

            if (campaigns.ok && (normalizedCampaigns.length || onChain.length)) {
              return mergeFeaturedItems(normalizedCampaigns, onChain).slice(0, 20);
            }

            const featured = await apiFetch(`/api/featured?${buildFeedQuery(chainId, refetchNonce, "featured")}`, { cache: "no-store" as RequestCache });
            const featuredJson = await featured.json().catch(() => null);
            const featuredItems = getResponseItems(featuredJson);

            if (featured.ok && featuredItems.length) {
              return featuredItems.map(normalizeFeaturedItem).filter(Boolean) as FeaturedItemApi[];
            }

            if (onChain.length) return onChain;

            if (!campaigns.ok || !featured.ok) {
              throw new Error(String(campaignJson?.error || featuredJson?.error || "Failed to load featured"));
            }

            return [];
          }''',
              '''async function fetchFeaturedItems(chainId: number, refetchNonce: number): Promise<FeaturedItemApi[]> {
            const featured = await apiFetch(`/api/featured?${buildFeedQuery(chainId, refetchNonce, "featured")}`, { cache: "no-store" as RequestCache });
            const featuredJson = await featured.json().catch(() => null);
            const featuredItems = getResponseItems(featuredJson)
              .map(normalizeFeaturedItem)
              .filter(Boolean)
              .filter(isLiveFeaturedItem) as FeaturedItemApi[];

            if (featured.ok && featuredItems.length) return featuredItems.slice(0, 20);

            const campaigns = await apiFetch(`/api/campaigns?${buildFeedQuery(chainId, refetchNonce, "campaigns")}`, { cache: "no-store" as RequestCache });
            const campaignJson = await campaigns.json().catch(() => null);
            const campaignItems = getResponseItems(campaignJson)
              .map(normalizeFeaturedItem)
              .filter(Boolean)
              .filter(isLiveFeaturedItem) as FeaturedItemApi[];

            if (campaigns.ok && campaignItems.length) return campaignItems.slice(0, 20);

            if (!campaigns.ok || !featured.ok) {
              throw new Error(String(featuredJson?.error || campaignJson?.error || "Failed to load featured"));
            }

            return [];
          }''',
          )
          replace_once(featured, '      const needsHydration = !item.name || item.name === "Unknown" || !item.symbol || !item.logoUri || !item.creatorAddress;', '      const needsHydration = !item.name || item.name === "Unknown" || !item.symbol || !hasUsableFeaturedImage(item.logoUri) || !item.creatorAddress;')
          replace_once(featured, '      return !found?.logoUri;', '      return !hasUsableFeaturedImage(found?.logoUri);')
          replace_once(featured, '      const rawLogo = it.logoUri || logoCache[addr] || null;', '      const rawLogo = hasUsableFeaturedImage(it.logoUri) ? it.logoUri : logoCache[addr] || null;')

          campaigns_base = "frontend/api/campaigns-base.js"
          replace_once(
              campaigns_base,
              '''            or ($4::text = 'live' and c.is_active = true)
                    or ($4::text = 'graduated' and c.graduated_at_chain is not null)''',
              '''            or ($4::text = 'live' and c.is_active = true and c.graduated_at_chain is null)
                    or ($4::text = 'graduated' and c.graduated_at_chain is not null)''',
          )

          workflow = Path(".github/workflows/fix-showcase-testing-issues.yml")
          workflow.unlink()
          PY

      - name: Verify focused behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dialog = Path("frontend/src/components/token/CreatorProtectionDialog.tsx").read_text()
          grid = Path("frontend/src/components/home/CampaignGrid.tsx").read_text()
          featured = Path("frontend/src/components/home/FeaturedCampaigns.tsx").read_text()
          campaigns = Path("frontend/api/campaigns-base.js").read_text()
          assert "Creator protection rules" in dialog
          assert "View Tier Rules" not in dialog
          assert "requiresIndexedGraduationState" in grid
          assert "hasUsableCampaignImage" in grid
          assert 'rawLogo = hasUsableCampaignImage' in grid
          assert '.filter(isLiveFeaturedItem)' in featured
          assert 'rawLogo = hasUsableFeaturedImage' in featured
          assert "c.is_active = true and c.graduated_at_chain is null" in campaigns
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit fixes to devpostgrad
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/token/CreatorProtectionDialog.tsx \
                  frontend/src/components/home/CampaignGrid.tsx \
                  frontend/src/components/home/FeaturedCampaigns.tsx \
                  frontend/api/campaigns-base.js \
                  .github/workflows/fix-showcase-testing-issues.yml
          git commit -m "Fix creator popup and graduated campaign feeds"
          git push origin HEAD:devpostgrad
