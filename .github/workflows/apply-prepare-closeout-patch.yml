name: Apply prepare closeout patch

on:
  push:
    branches:
      - agent/fix-prepare-closeout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-prepare-closeout
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply targeted patch
        run: node scripts/apply-prepare-closeout-patch.mjs

      - name: Validate API module syntax
        run: |
          node --check frontend/api/dev-fix/drafts-base.js
          node --check frontend/api/dev-fix/draft-read-base.js

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify clean diff
        run: git diff --check

      - name: Commit prepared source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Prepare Mode closeout flow"
          git push origin HEAD:agent/fix-prepare-closeout
