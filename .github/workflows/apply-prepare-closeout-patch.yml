name: Apply prepare closeout patch

on:
  push:
    branches:
      - agent/fix-prepare-closeout
  pull_request:
    branches:
      - devpostgrad
    paths:
      - scripts/apply-prepare-closeout-patch.mjs
      - .github/workflows/apply-prepare-closeout-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-prepare-closeout
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Normalize temporary patch literals
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/apply-prepare-closeout-patch.mjs';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(
            'const root = process.cwd();',
            'const root = process.cwd();\nconst JUST_CREATED_DRAFT_CACHE_PREFIX = "${JUST_CREATED_DRAFT_CACHE_PREFIX}";\nconst draftId = "${draftId}";',
          );
          const cardLine = fs.readFileSync('frontend/src/components/home/DraftCampaignGrid.tsx', 'utf8')
            .split('\n')
            .find((line) => line.includes('<div className="truncate text-success/75">{shortAddr(draft.creatorWallet)}</div>'));
          if (!cardLine) throw new Error('Draft card creator line not found');
          source = source.replace(
            /  `\s*<div className="truncate text-success\/75">\{shortAddr\(draft\.creatorWallet\)\}<\/div>`,/,
            '  `' + cardLine + '`,',
          );
          fs.writeFileSync(file, source);
          NODE

      - name: Apply targeted patch
        run: node scripts/apply-prepare-closeout-patch.mjs

      - name: Validate API module syntax
        run: |
          node --check frontend/api/dev-fix/drafts-base.js
          node --check frontend/api/dev-fix/draft-read-base.js

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify clean diff
        run: git diff --check

      - name: Commit prepared source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Prepare Mode closeout flow"
          git push origin HEAD:agent/fix-prepare-closeout
