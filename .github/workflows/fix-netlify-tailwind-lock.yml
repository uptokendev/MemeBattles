name: Regenerate frontend Tailwind lock

on:
  push:
    branches:
      - agent/fix-netlify-tailwind-and-worker-config
    paths:
      - frontend/package.json
      - .github/workflows/fix-netlify-tailwind-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-netlify-tailwind-and-worker-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --include=dev

      - name: Verify clean dependency install
        working-directory: frontend
        run: npm ci --ignore-scripts --include=dev

      - name: Verify production frontend build
        working-directory: frontend
        run: npm run build

      - name: Verify Tailwind is a direct build dependency
        run: |
          node <<'NODE'
          const lock = require('./frontend/package-lock.json');
          const root = lock.packages?.[''];
          const tailwind = lock.packages?.['node_modules/tailwindcss'];
          if (root?.devDependencies?.tailwindcss !== '^3.4.17') {
            throw new Error('Tailwind is not recorded as a direct frontend devDependency.');
          }
          if (!tailwind || tailwind.dev !== true) {
            throw new Error('Tailwind lock entry is not marked as a direct development dependency.');
          }
          if (root.hasInstallScript) {
            throw new Error('Stale frontend install-script metadata remains in package-lock.json.');
          }
          NODE

      - name: Commit regenerated lock and remove temporary workflow
        run: |
          rm .github/workflows/fix-netlify-tailwind-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/fix-netlify-tailwind-lock.yml
          git commit -m "Regenerate frontend lock for Tailwind"
          git push origin HEAD:agent/fix-netlify-tailwind-and-worker-config
