name: Apply market-cap consistency fix

on:
  push:
    branches:
      - agent/fix-marketcap-canonical-consistency

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-marketcap-canonical-consistency

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: realtime-indexer/package-lock.json

      - name: Apply focused canonical market-cap fixes
        run: python3 scripts/apply_marketcap_consistency_fix.py

      - name: Install realtime indexer dependencies
        working-directory: realtime-indexer
        run: npm ci

      - name: Build realtime indexer
        working-directory: realtime-indexer
        run: npm run build

      - name: Verify focused invariants
        shell: bash
        run: |
          grep -q 'const VERSION = 2' realtime-indexer/src/canonicalCandleMaterializer.ts
          grep -q 'function sold() view returns (uint256)' realtime-indexer/src/canonicalCandleMaterializer.ts
          grep -q 'fixedBondingSupplyWhole' realtime-indexer/src/meteoraSwapIndexer.ts
          grep -q 'dex_trade_count=coalesce(public.token_candles.dex_trade_count,0)+1' realtime-indexer/src/meteoraSwapIndexer.ts

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Patch already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add realtime-indexer/src/canonicalCandleMaterializer.ts realtime-indexer/src/meteoraSwapIndexer.ts
          git commit -m '[marketcap-fix-applied] Align canonical market cap sources'
          git push origin HEAD:agent/fix-marketcap-canonical-consistency
