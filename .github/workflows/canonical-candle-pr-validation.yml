name: Canonical candle PR validation

on:
  pull_request:
    branches:
      - devpostgrad

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/pump-style-candle-stabilization'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend without rewriting lockfile
        run: npm install --prefix frontend --package-lock=false --no-audit --no-fund

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install realtime indexer without rewriting lockfile
        run: npm install --prefix realtime-indexer --package-lock=false --no-audit --no-fund

      - name: Compile realtime indexer and reject new TypeScript errors
        shell: bash
        run: |
          set +e
          npm --prefix realtime-indexer run build 2>&1 | tee /tmp/realtime-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep "error TS" /tmp/realtime-build.log > /tmp/all-errors.log || true
          grep -vF "src/solanaIndexer.ts(589,70): error TS18047: 'fillPrice' is possibly 'null'." /tmp/all-errors.log > /tmp/unexpected-errors.log || true
          if [ -s /tmp/unexpected-errors.log ]; then
            echo "Unexpected realtime-indexer TypeScript errors:"
            cat /tmp/unexpected-errors.log
            exit "$status"
          fi
          error_count=$(wc -l < /tmp/all-errors.log | tr -d ' ')
          if [ "$error_count" != "1" ]; then
            echo "Expected exactly the single known devpostgrad nullable-guard error; got $error_count errors."
            cat /tmp/all-errors.log
            exit "$status"
          fi
          echo "Realtime candle changes add no TypeScript errors; only the known devpostgrad solanaIndexer nullable guard remains."
