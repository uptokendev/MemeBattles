name: Refresh Solana foundation branch from devpostgrad

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/solana-refresh-from-devpostgrad-once.yml

permissions:
  contents: write

jobs:
  refresh-branch:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Solana foundation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-phase0-refresh
          fetch-depth: 0

      - name: Merge latest devpostgrad
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin devpostgrad
          git merge --no-edit origin/devpostgrad
          git diff --check HEAD^ HEAD
          git status --short

      - name: Verify Solana-only feature diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/devpostgrad...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(contracts/|scripts/.*topaz|deployments/|frontend/src/.*topaz)' ; then
            echo 'Unexpected BNB/Topaz production file in Solana feature diff.' >&2
            exit 1
          fi

      - name: Push refreshed branch
        shell: bash
        run: git push origin HEAD:agent/solana-v2-phase0-refresh
