name: Apply market-cap follow-up

on:
  push:
    branches:
      - agent/fix-marketcap-canonical-consistency

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-marketcap-canonical-consistency
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: realtime-indexer/package-lock.json
      - name: Apply DEX separation patch
        run: |
          if grep -q 'chain_id <> 101 or sold_tokens_after_raw is not null' realtime-indexer/src/canonicalCandleMaterializer.ts; then
            echo 'Follow-up patch already present.'
          else
            python3 scripts/apply_marketcap_followup.py
          fi
      - name: Install realtime indexer dependencies
        working-directory: realtime-indexer
        run: npm ci
      - name: Build realtime indexer
        working-directory: realtime-indexer
        run: npm run build
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add realtime-indexer/src/canonicalCandleMaterializer.ts
          git commit -m '[marketcap-followup-applied] Separate bonding and DEX candle passes'
          git push origin HEAD:agent/fix-marketcap-canonical-consistency
