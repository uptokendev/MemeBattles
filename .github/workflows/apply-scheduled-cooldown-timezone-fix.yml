name: Apply scheduled cooldown and timezone repair

on:
  push:
    branches:
      - agent/fix-scheduled-cooldown-timezone
    paths:
      - scripts/apply-scheduled-cooldown-timezone-fix.mjs
      - scripts/repair-scheduled-cooldown-patch.mjs
      - .github/workflows/apply-scheduled-cooldown-timezone-fix.yml

permissions:
  contents: write

concurrency:
  group: scheduled-cooldown-timezone-repair
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-scheduled-cooldown-timezone
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Repair and apply source patch
        run: |
          node scripts/repair-scheduled-cooldown-patch.mjs
          node --check scripts/apply-scheduled-cooldown-timezone-fix.mjs
          node scripts/apply-scheduled-cooldown-timezone-fix.mjs

      - name: Install contract dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile contracts and run scheduled factory tests
        run: |
          npm run compile
          npx hardhat test test/LaunchFactory.spec.ts
          npm run size

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Validate API source and frontend integration
        run: |
          node --check frontend/api/dev-fix/security.js
          node --check frontend/api/dev-fix/draft-deploy-base.js
          node --check frontend/api/dev-fix/draft-deploy.js
          npm --prefix frontend run check:api-imports
          npm --prefix frontend run test:wallet-discovery
          npm --prefix frontend run build

      - name: Publish validated source changes
        shell: bash
        run: |
          git diff --check
          rm -f scripts/apply-scheduled-cooldown-timezone-fix.mjs
          rm -f scripts/repair-scheduled-cooldown-patch.mjs
          rm -f .github/workflows/apply-scheduled-cooldown-timezone-fix.yml
          git config user.name "MemeWarzone Build Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repair produced no changes."
            exit 1
          fi
          git commit -m "Allow scheduled launches after creator cooldown"
          git push origin HEAD:agent/fix-scheduled-cooldown-timezone
