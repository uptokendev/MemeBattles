name: Apply token route campaign fix

on:
  pull_request:
    branches:
      - devpostgrad
  push:
    branches:
      - agent/fix-token-route-campaign-resolution

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-token-route-campaign-resolution
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply canonical campaign resolution fix
        run: node .github/scripts/apply-token-route-campaign-fix.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --include=dev

      - name: Run creator-cluster regression tests
        working-directory: frontend
        run: node --test api/dev-fix/creator-cluster-protection.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/launchpadClient.ts frontend/src/pages/TokenDetails.tsx frontend/api/dev-fix/creator-cluster-protection.test.mjs
          git commit -m "Resolve token routes to campaign contracts"
          git push origin HEAD:agent/fix-token-route-campaign-resolution
