name: Solana Anchor CI

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - Anchor.toml
      - Cargo.toml
      - Cargo.lock
      - programs/memewarzone_solana/**
      - .github/workflows/solana-anchor-ci.yml
  workflow_dispatch:

jobs:
  anchor-build:
    name: Anchor build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: solanafoundation/anchor:v0.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          anchor --version
          solana --version
          rustc --version
          cargo --version

      - name: Build Solana program
        run: anchor build
