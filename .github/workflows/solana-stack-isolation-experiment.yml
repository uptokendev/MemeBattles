name: Solana Stack Isolation Experiment

on:
  push:
    branches:
      - hotfix/solana-mainnet-transaction-normalization
    paths:
      - programs/memewarzone_solana/**
      - tests/solana/**
      - .github/workflows/solana-stack-isolation-experiment.yml
  pull_request:
    branches:
      - main
    paths:
      - programs/memewarzone_solana/**
      - tests/solana/**
      - .github/workflows/solana-stack-isolation-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solana-stack-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANCHOR_VERSION: 0.30.1
  SOLANA_VERSION: 1.18.26
  AGAVE_VERSION: 4.2.0
  RUST_TOOLCHAIN: 1.79.0
  IDL_RUST_TOOLCHAIN: nightly-2024-05-09
  ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
  MAINNET_RPC: https://api.mainnet-beta.solana.com
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt

jobs:
  stack-probe:
    name: Probe ${{ matrix.variant }} on Mainnet Agave
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
          - trade-marker
          - trade-risk-constraint-lite
          - graduation-box
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install frozen Solana build CLI
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Agave runtime
        shell: bash
        run: |
          set -euo pipefail
          agave_dir="$RUNNER_TEMP/agave-v${AGAVE_VERSION}"
          mkdir -p "$agave_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/agave-release.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/v${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/agave-release.tar.bz2 -C "$agave_dir" --strip-components=1
          echo "AGAVE_BIN=$agave_dir/bin" >> "$GITHUB_ENV"
          "$agave_dir/bin/solana-test-validator" --version

      - name: Install Anchor CLI
        run: npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"

      - name: Apply isolated source variant in runner
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          variant = os.environ["VARIANT"]
          trade_path = Path("programs/memewarzone_solana/src/authorized_trade.rs")
          graduation_path = Path("programs/memewarzone_solana/src/graduation.rs")

          if variant.startswith("trade-"):
              source = trade_path.read_text(encoding="utf-8")
              marker_old = "pub fn buy_tokens_handler(ctx: Context<BuyTokens>, args: BuyTokensArgs) -> Result<()> {\n    let now = Clock::get()?.unix_timestamp;"
              marker_new = "pub fn buy_tokens_handler(ctx: Context<BuyTokens>, args: BuyTokensArgs) -> Result<()> {\n    msg!(\"BUY_HANDLER_ENTER\");\n    let now = Clock::get()?.unix_timestamp;"
              if source.count(marker_old) != 1:
                  raise SystemExit("buy handler marker target not unique")
              source = source.replace(marker_old, marker_new, 1)

              if variant == "trade-risk-constraint-lite":
                  risk = "    #[account(seeds = [RISK_PROFILE_SEED, trader.key().as_ref()], bump)]\n    pub risk_profile: UncheckedAccount<'info>,"
                  if source.count(risk) != 2:
                      raise SystemExit(f"expected two risk PDA constraints, found {source.count(risk)}")
                  source = source.replace(risk, "    pub risk_profile: UncheckedAccount<'info>,")

              trade_path.write_text(source, encoding="utf-8")

          elif variant == "graduation-box":
              source = graduation_path.read_text(encoding="utf-8")
              marker_old = "pub fn begin_graduation_handler(\n    ctx: Context<BeginGraduation>,\n    args: BeginGraduationArgs,\n) -> Result<()> {\n    let now = Clock::get()?.unix_timestamp;"
              marker_new = "pub fn begin_graduation_handler(\n    ctx: Context<BeginGraduation>,\n    args: BeginGraduationArgs,\n) -> Result<()> {\n    msg!(\"BEGIN_GRAD_HANDLER_ENTER\");\n    let now = Clock::get()?.unix_timestamp;"
              if source.count(marker_old) != 1:
                  raise SystemExit("begin graduation marker target not unique")
              source = source.replace(marker_old, marker_new, 1)

              account = "    pub graduation_state: Account<'info, GraduationState>,"
              if source.count(account) != 2:
                  raise SystemExit(f"expected two GraduationState Account wrappers, found {source.count(account)}")
              source = source.replace(account, "    pub graduation_state: Box<Account<'info, GraduationState>>,")
              graduation_path.write_text(source, encoding="utf-8")
          else:
              raise SystemExit(f"unknown variant {variant}")
          PY
          echo "variant=$VARIANT"
          git diff -- programs/memewarzone_solana/src/authorized_trade.rs programs/memewarzone_solana/src/graduation.rs

      - name: Create ephemeral payer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force \
            --outfile "$HOME/.config/solana/id.json"
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"

      - name: Build source variant SBF
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -o pipefail
          anchor build --program-name memewarzone_solana --no-idl \
            2>&1 | tee "/tmp/mwz-${VARIANT}-build.log" | tail -n 180
          test -s target/deploy/memewarzone_solana.so
          sha256sum target/deploy/memewarzone_solana.so | tee "/tmp/mwz-${VARIANT}-sha.txt"
          wc -c target/deploy/memewarzone_solana.so

      - name: Generate matching IDL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/idl
          (
            cd programs/memewarzone_solana
            RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build \
              --out ../../target/idl/memewarzone_solana.json
          )
          test -s target/idl/memewarzone_solana.json

      - name: Install acceptance dependencies
        run: npm install --prefix tests/solana --no-audit --no-fund

      - name: Run targeted Agave/Mainnet probe
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          rm -rf "/tmp/mwz-${VARIANT}-ledger"
          "$AGAVE_BIN/solana-test-validator" \
            --reset \
            --quiet \
            --ledger "/tmp/mwz-${VARIANT}-ledger" \
            --url "$MAINNET_RPC" \
            --clone-feature-set \
            --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so \
            > "/tmp/mwz-${VARIANT}-validator.log" 2>&1 &
          validator_pid=$!
          trap 'kill "$validator_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if "$AGAVE_BIN/solana" cluster-version --url "$ANCHOR_PROVIDER_URL" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 120 ]; then tail -n 240 "/tmp/mwz-${VARIANT}-validator.log" >&2; exit 1; fi
            sleep 2
          done
          "$AGAVE_BIN/solana" config set --url "$ANCHOR_PROVIDER_URL" --keypair "$ANCHOR_WALLET" >/dev/null
          "$AGAVE_BIN/solana" airdrop 100 >/dev/null
          if [[ "$VARIANT" == graduation-* ]]; then
            TEST_GREP='begin_graduation'
          else
            TEST_GREP='create.*close curve'
          fi
          (
            cd tests/solana
            ANCHOR_PROVIDER_URL="$ANCHOR_PROVIDER_URL" ANCHOR_WALLET="$ANCHOR_WALLET" \
              npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs --grep "$TEST_GREP"
          ) 2>&1 | tee "/tmp/mwz-${VARIANT}-acceptance.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-stack-${{ matrix.variant }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/mwz-${{ matrix.variant }}-build.log
            /tmp/mwz-${{ matrix.variant }}-sha.txt
            /tmp/mwz-${{ matrix.variant }}-validator.log
            /tmp/mwz-${{ matrix.variant }}-acceptance.log
            target/deploy/memewarzone_solana.so
