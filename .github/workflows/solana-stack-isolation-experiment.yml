name: Solana Trade Raw Campaign Probe

on:
  push:
    branches:
      - hotfix/solana-mainnet-transaction-normalization
    paths:
      - programs/memewarzone_solana/**
      - tests/solana/**
      - .github/workflows/solana-stack-isolation-experiment.yml
  pull_request:
    branches:
      - main
    paths:
      - programs/memewarzone_solana/**
      - tests/solana/**
      - .github/workflows/solana-stack-isolation-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solana-trade-raw-campaign-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANCHOR_VERSION: 0.30.1
  SOLANA_VERSION: 1.18.26
  AGAVE_VERSION: 4.2.0
  RUST_TOOLCHAIN: 1.79.0
  IDL_RUST_TOOLCHAIN: nightly-2024-05-09
  ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
  MAINNET_RPC: https://api.mainnet-beta.solana.com
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt

jobs:
  raw-campaign-probe:
    name: Prove raw Campaign BUY/SELL hot path on Mainnet Agave
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install frozen Solana build CLI
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Agave runtime
        shell: bash
        run: |
          set -euo pipefail
          agave_dir="$RUNNER_TEMP/agave-v${AGAVE_VERSION}"
          mkdir -p "$agave_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/agave-release.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/v${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/agave-release.tar.bz2 -C "$agave_dir" --strip-components=1
          echo "AGAVE_BIN=$agave_dir/bin" >> "$GITHUB_ENV"
          "$agave_dir/bin/solana-test-validator" --version

      - name: Install Anchor CLI
        run: npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"

      - name: Apply raw Campaign read hot path in runner only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("programs/memewarzone_solana/src/authorized_trade.rs")
          source = path.read_text(encoding="utf-8")

          helper = dedent(r'''
          #[derive(Clone, Copy)]
          struct TradeCampaignSnapshot {
              campaign_id: [u8; 32],
              creator: Pubkey,
              mint: Pubkey,
              token_vault: Pubkey,
              sol_vault: Pubkey,
              launch_at: i64,
              economics_version: u16,
              curve_kind: u8,
              curve_token_supply: u64,
              token_decimals: u8,
              base_price_lamports: u64,
              price_slope_lamports: u64,
              buy_fee_bps: u16,
              sell_fee_bps: u16,
              creator_buy_lock_until: i64,
              creator_buy_cap_bps: u16,
              sold_tokens: u64,
              net_raised_lamports: u64,
              creator_bought_tokens: u64,
              graduated: bool,
              curve_closed: bool,
              paused: bool,
              bump: u8,
          }

          const CAMPAIGN_ACCOUNT_BYTES: usize = 720;
          const CAMPAIGN_SOLD_TOKENS_OFFSET: usize = 662;
          const CAMPAIGN_NET_RAISED_OFFSET: usize = 670;
          const CAMPAIGN_CREATOR_BOUGHT_OFFSET: usize = 702;

          fn trade_data_range<'a>(data: &'a [u8], offset: usize, len: usize) -> Result<&'a [u8]> {
              let end = offset.checked_add(len).ok_or(LaunchpadError::MathOverflow)?;
              require!(end <= data.len(), LaunchpadError::InvalidCampaign);
              Ok(&data[offset..end])
          }

          fn trade_read_u8(data: &[u8], offset: usize) -> Result<u8> {
              Ok(*trade_data_range(data, offset, 1)?
                  .first()
                  .ok_or(LaunchpadError::InvalidCampaign)?)
          }

          fn trade_read_bool(data: &[u8], offset: usize) -> Result<bool> {
              let value = trade_read_u8(data, offset)?;
              require!(value <= 1, LaunchpadError::InvalidCampaign);
              Ok(value == 1)
          }

          fn trade_read_u16(data: &[u8], offset: usize) -> Result<u16> {
              let raw = trade_data_range(data, offset, 2)?;
              Ok(u16::from_le_bytes([raw[0], raw[1]]))
          }

          fn trade_read_u64(data: &[u8], offset: usize) -> Result<u64> {
              let raw = trade_data_range(data, offset, 8)?;
              Ok(u64::from_le_bytes(raw.try_into().map_err(|_| error!(LaunchpadError::InvalidCampaign))?))
          }

          fn trade_read_i64(data: &[u8], offset: usize) -> Result<i64> {
              let raw = trade_data_range(data, offset, 8)?;
              Ok(i64::from_le_bytes(raw.try_into().map_err(|_| error!(LaunchpadError::InvalidCampaign))?))
          }

          fn trade_read_32(data: &[u8], offset: usize) -> Result<[u8; 32]> {
              trade_data_range(data, offset, 32)?
                  .try_into()
                  .map_err(|_| error!(LaunchpadError::InvalidCampaign))
          }

          fn trade_read_pubkey(data: &[u8], offset: usize) -> Result<Pubkey> {
              Ok(Pubkey::new_from_array(trade_read_32(data, offset)?))
          }

          fn trade_assert_campaign_data(data: &[u8]) -> Result<()> {
              require!(data.len() >= CAMPAIGN_ACCOUNT_BYTES, LaunchpadError::InvalidCampaign);
              require!(
                  data.get(..8) == Some(Campaign::DISCRIMINATOR.as_ref()),
                  LaunchpadError::InvalidCampaign
              );
              Ok(())
          }

          #[inline(never)]
          fn load_trade_campaign_snapshot(info: &AccountInfo) -> Result<TradeCampaignSnapshot> {
              require_keys_eq!(*info.owner, crate::ID, LaunchpadError::InvalidCampaign);
              let data = info.try_borrow_data()?;
              trade_assert_campaign_data(&data)?;
              Ok(TradeCampaignSnapshot {
                  campaign_id: trade_read_32(&data, 8)?,
                  creator: trade_read_pubkey(&data, 136)?,
                  mint: trade_read_pubkey(&data, 168)?,
                  token_vault: trade_read_pubkey(&data, 200)?,
                  sol_vault: trade_read_pubkey(&data, 232)?,
                  launch_at: trade_read_i64(&data, 400)?,
                  economics_version: trade_read_u16(&data, 417)?,
                  curve_kind: trade_read_u8(&data, 419)?,
                  curve_token_supply: trade_read_u64(&data, 428)?,
                  token_decimals: trade_read_u8(&data, 452)?,
                  base_price_lamports: trade_read_u64(&data, 457)?,
                  price_slope_lamports: trade_read_u64(&data, 465)?,
                  buy_fee_bps: trade_read_u16(&data, 473)?,
                  sell_fee_bps: trade_read_u16(&data, 475)?,
                  creator_buy_lock_until: trade_read_i64(&data, 644)?,
                  creator_buy_cap_bps: trade_read_u16(&data, 652)?,
                  sold_tokens: trade_read_u64(&data, CAMPAIGN_SOLD_TOKENS_OFFSET)?,
                  net_raised_lamports: trade_read_u64(&data, CAMPAIGN_NET_RAISED_OFFSET)?,
                  creator_bought_tokens: trade_read_u64(&data, CAMPAIGN_CREATOR_BOUGHT_OFFSET)?,
                  graduated: trade_read_bool(&data, 713)?,
                  curve_closed: trade_read_bool(&data, 714)?,
                  paused: trade_read_bool(&data, 715)?,
                  bump: trade_read_u8(&data, 716)?,
              })
          }

          #[inline(never)]
          fn validate_trade_snapshot_accounts(
              campaign: &TradeCampaignSnapshot,
              campaign_key: Pubkey,
              mint_key: Pubkey,
              token_vault_key: Pubkey,
              sol_vault_key: Pubkey,
          ) -> Result<()> {
              require_keys_eq!(campaign.mint, mint_key, LaunchpadError::InvalidCampaign);
              require_keys_eq!(campaign.token_vault, token_vault_key, LaunchpadError::InvalidCampaign);
              require_keys_eq!(campaign.sol_vault, sol_vault_key, LaunchpadError::InvalidCampaign);
              let (expected_campaign, _) =
                  Pubkey::find_program_address(&[CAMPAIGN_SEED, campaign.campaign_id.as_ref()], &crate::ID);
              require_keys_eq!(campaign_key, expected_campaign, LaunchpadError::InvalidCampaign);
              let (expected_vault, _) = Pubkey::find_program_address(
                  &[TOKEN_VAULT_SEED, campaign.campaign_id.as_ref()],
                  &crate::ID,
              );
              require_keys_eq!(token_vault_key, expected_vault, LaunchpadError::InvalidCampaign);
              let (expected_sol, _) =
                  Pubkey::find_program_address(&[SOL_VAULT_SEED, campaign.campaign_id.as_ref()], &crate::ID);
              require_keys_eq!(sol_vault_key, expected_sol, LaunchpadError::InvalidCampaign);
              Ok(())
          }

          ''')

          insert_at = source.index("#[inline(never)]\nfn prepare_buy(")
          source = source[:insert_at] + helper + source[insert_at:]

          prepare_start = source.index("fn prepare_buy(")
          apply_start = source.index("#[inline(never)]\nfn apply_buy_state(", prepare_start)
          region = source[prepare_start:apply_start]
          if region.count("let campaign = load_campaign_box(campaign_info)?;") != 2:
              raise SystemExit("expected exactly two prepare campaign loads")
          if region.count("validate_trade_accounts(") != 2:
              raise SystemExit("expected exactly two prepare account validators")
          region = region.replace(
              "let campaign = load_campaign_box(campaign_info)?;",
              "let campaign = load_trade_campaign_snapshot(campaign_info)?;",
          )
          region = region.replace("validate_trade_accounts(", "validate_trade_snapshot_accounts(")
          source = source[:prepare_start] + region + source[apply_start:]
          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          git diff -- programs/memewarzone_solana/src/authorized_trade.rs

      - name: Create ephemeral payer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force \
            --outfile "$HOME/.config/solana/id.json"
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"

      - name: Build raw Campaign SBF
        shell: bash
        run: |
          set -o pipefail
          anchor build --program-name memewarzone_solana --no-idl \
            2>&1 | tee /tmp/mwz-raw-campaign-build.log | tail -n 180
          test -s target/deploy/memewarzone_solana.so
          sha256sum target/deploy/memewarzone_solana.so | tee /tmp/mwz-raw-campaign-sha.txt
          wc -c target/deploy/memewarzone_solana.so

      - name: Generate matching IDL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/idl
          (
            cd programs/memewarzone_solana
            RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build \
              --out ../../target/idl/memewarzone_solana.json
          )
          test -s target/idl/memewarzone_solana.json

      - name: Install acceptance dependencies
        run: npm install --prefix tests/solana --no-audit --no-fund

      - name: Run BUY/SELL lifecycle on Mainnet Agave
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mwz-raw-campaign-ledger
          "$AGAVE_BIN/solana-test-validator" \
            --reset \
            --quiet \
            --ledger /tmp/mwz-raw-campaign-ledger \
            --url "$MAINNET_RPC" \
            --clone-feature-set \
            --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so \
            > /tmp/mwz-raw-campaign-validator.log 2>&1 &
          validator_pid=$!
          trap 'kill "$validator_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if "$AGAVE_BIN/solana" cluster-version --url "$ANCHOR_PROVIDER_URL" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 120 ]; then tail -n 240 /tmp/mwz-raw-campaign-validator.log >&2; exit 1; fi
            sleep 2
          done
          "$AGAVE_BIN/solana" config set --url "$ANCHOR_PROVIDER_URL" --keypair "$ANCHOR_WALLET" >/dev/null
          "$AGAVE_BIN/solana" airdrop 100 >/dev/null
          (
            cd tests/solana
            ANCHOR_PROVIDER_URL="$ANCHOR_PROVIDER_URL" ANCHOR_WALLET="$ANCHOR_WALLET" \
              npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs --grep 'create.*close curve'
          ) 2>&1 | tee /tmp/mwz-raw-campaign-acceptance.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-raw-campaign-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/mwz-raw-campaign-build.log
            /tmp/mwz-raw-campaign-sha.txt
            /tmp/mwz-raw-campaign-validator.log
            /tmp/mwz-raw-campaign-acceptance.log
            target/deploy/memewarzone_solana.so
