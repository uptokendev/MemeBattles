name: Solana BUY Stack Boundary Probe

on:
  push:
    branches:
      - hotfix/solana-mainnet-transaction-normalization
    paths:
      - programs/memewarzone_solana/**
      - tests/solana/**
      - .github/workflows/solana-stack-isolation-experiment.yml
  pull_request:
    branches:
      - main
    paths:
      - programs/memewarzone_solana/**
      - tests/solana/**
      - .github/workflows/solana-stack-isolation-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solana-buy-stack-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANCHOR_VERSION: 0.30.1
  SOLANA_VERSION: 1.18.26
  AGAVE_VERSION: 4.2.0
  RUST_TOOLCHAIN: 1.79.0
  IDL_RUST_TOOLCHAIN: nightly-2024-05-09
  ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
  MAINNET_RPC: https://api.mainnet-beta.solana.com
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt

jobs:
  boundary-probe:
    name: Locate prepare_buy frame-13 boundary on Mainnet Agave
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install frozen Solana build CLI
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Agave runtime
        shell: bash
        run: |
          set -euo pipefail
          agave_dir="$RUNNER_TEMP/agave-v${AGAVE_VERSION}"
          mkdir -p "$agave_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/agave-release.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/v${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/agave-release.tar.bz2 -C "$agave_dir" --strip-components=1
          echo "AGAVE_BIN=$agave_dir/bin" >> "$GITHUB_ENV"
          "$agave_dir/bin/solana-test-validator" --version

      - name: Install Anchor CLI
        run: npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"

      - name: Inject prepare_buy stage markers in runner only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("programs/memewarzone_solana/src/authorized_trade.rs")
          source = path.read_text(encoding="utf-8")
          prepare_start = source.index("fn prepare_buy(")
          prepare_end = source.index("#[inline(never)]\nfn prepare_sell(", prepare_start)
          prefix = source[:prepare_start]
          prepare = source[prepare_start:prepare_end]
          suffix = source[prepare_end:]

          replacements = [
              (
                  ") -> Result<PreparedBuy> {\n    let campaign = load_campaign_box(campaign_info)?;",
                  ") -> Result<PreparedBuy> {\n    msg!(\"PREP_0_ENTER\");\n    let campaign = load_campaign_box(campaign_info)?;\n    msg!(\"PREP_1_CAMPAIGN_LOADED\");",
              ),
              (
                  "        sol_vault_key,\n    )?;\n    require!(!campaign.graduated, LaunchpadError::AlreadyGraduated);",
                  "        sol_vault_key,\n    )?;\n    msg!(\"PREP_2_ACCOUNTS_VALIDATED\");\n    require!(!campaign.graduated, LaunchpadError::AlreadyGraduated);",
              ),
              (
                  "    let campaign_mint = campaign.mint;\n    drop(campaign);",
                  "    let campaign_mint = campaign.mint;\n    drop(campaign);\n    msg!(\"PREP_3_FIELDS_COPIED\");",
              ),
              (
                  "    if auth_required {\n        verify_buy_authorization(",
                  "    if auth_required {\n        msg!(\"PREP_4_AUTH_START\");\n        verify_buy_authorization(",
              ),
              (
                  "            args,\n        )?;\n    }\n\n    let (tokens_out, net, fee, lamports_spent) = quote_buy_prepared(",
                  "            args,\n        )?;\n        msg!(\"PREP_5_AUTH_VERIFIED\");\n    }\n\n    msg!(\"PREP_6_QUOTE_START\");\n    let (tokens_out, net, fee, lamports_spent) = quote_buy_prepared(",
              ),
              (
                  "        decimals,\n    )?;\n    require!(\n        tokens_out >= args.min_tokens_out,",
                  "        decimals,\n    )?;\n    msg!(\"PREP_7_QUOTED\");\n    require!(\n        tokens_out >= args.min_tokens_out,",
              ),
              (
                  "    Ok(PreparedBuy {\n        campaign_id,",
                  "    msg!(\"PREP_8_COMPLETE\");\n    Ok(PreparedBuy {\n        campaign_id,",
              ),
          ]

          for old, new in replacements:
              count = prepare.count(old)
              if count != 1:
                  raise SystemExit(f"prepare_buy marker target not unique: found {count} for {old[:100]!r}")
              prepare = prepare.replace(old, new, 1)

          path.write_text(prefix + prepare + suffix, encoding="utf-8")
          PY
          git diff -- programs/memewarzone_solana/src/authorized_trade.rs

      - name: Create ephemeral payer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force \
            --outfile "$HOME/.config/solana/id.json"
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"

      - name: Build marked SBF
        shell: bash
        run: |
          set -o pipefail
          anchor build --program-name memewarzone_solana --no-idl \
            2>&1 | tee /tmp/mwz-buy-boundary-build.log | tail -n 180
          test -s target/deploy/memewarzone_solana.so
          sha256sum target/deploy/memewarzone_solana.so | tee /tmp/mwz-buy-boundary-sha.txt
          wc -c target/deploy/memewarzone_solana.so

      - name: Generate matching IDL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/idl
          (
            cd programs/memewarzone_solana
            RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build \
              --out ../../target/idl/memewarzone_solana.json
          )
          test -s target/idl/memewarzone_solana.json

      - name: Install acceptance dependencies
        run: npm install --prefix tests/solana --no-audit --no-fund

      - name: Run BUY lifecycle boundary probe on Mainnet Agave
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mwz-buy-boundary-ledger
          "$AGAVE_BIN/solana-test-validator" \
            --reset \
            --quiet \
            --ledger /tmp/mwz-buy-boundary-ledger \
            --url "$MAINNET_RPC" \
            --clone-feature-set \
            --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so \
            > /tmp/mwz-buy-boundary-validator.log 2>&1 &
          validator_pid=$!
          trap 'kill "$validator_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if "$AGAVE_BIN/solana" cluster-version --url "$ANCHOR_PROVIDER_URL" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 120 ]; then tail -n 240 /tmp/mwz-buy-boundary-validator.log >&2; exit 1; fi
            sleep 2
          done
          "$AGAVE_BIN/solana" config set --url "$ANCHOR_PROVIDER_URL" --keypair "$ANCHOR_WALLET" >/dev/null
          "$AGAVE_BIN/solana" airdrop 100 >/dev/null
          (
            cd tests/solana
            ANCHOR_PROVIDER_URL="$ANCHOR_PROVIDER_URL" ANCHOR_WALLET="$ANCHOR_WALLET" \
              npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs --grep 'create.*close curve'
          ) 2>&1 | tee /tmp/mwz-buy-boundary-acceptance.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-buy-boundary-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/mwz-buy-boundary-build.log
            /tmp/mwz-buy-boundary-sha.txt
            /tmp/mwz-buy-boundary-validator.log
            /tmp/mwz-buy-boundary-acceptance.log
            target/deploy/memewarzone_solana.so
