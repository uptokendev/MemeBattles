name: Fix Solana nullable fill price once

on:
  push:
    branches:
      - agent/pump-style-candle-stabilization

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pump-style-candle-stabilization
          fetch-depth: 0
      - name: Apply exact nullable guard fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('realtime-indexer/src/solanaIndexer.ts')
          s = p.read_text()
          old = 'const lastPrice = curve?.spotSol ?? (Number.isFinite(fillPrice) && fillPrice > 0 ? fillPrice : null);'
          new = 'const lastPrice = curve?.spotSol ?? (fillPrice != null && Number.isFinite(fillPrice) && fillPrice > 0 ? fillPrice : null);'
          if old not in s:
              raise SystemExit('Expected nullable-guard line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realtime-indexer/src/solanaIndexer.ts
          git commit -m "Guard nullable Solana fill price"
          git push origin HEAD:agent/pump-style-candle-stabilization
