name: Finalize Solana Preflight Source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/finalize-solana-policy-tests.py
      - .github/scripts/finalize-solana-create-preview.py
      - .github/workflows/finalize-solana-preflight-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/solana-final-launch-blockers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solana-final-launch-blockers
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final source changes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/finalize-solana-policy-tests.py
          python .github/scripts/finalize-solana-create-preview.py
          rustfmt --edition 2021 programs/memewarzone_solana/src/authorized_trade.rs
          git diff --check
          node --check frontend/api/dev-fix/solana-trade-authorization-v1.js
          node --test frontend/api/dev-fix/solana-trade-preflight-final.test.mjs
          npm install --prefix frontend --no-audit --no-fund
          npm --prefix frontend run build

      - name: Commit final source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MemeWarzone Launch Bot"
          git config user.email "launch-bot@users.noreply.github.com"
          git add \
            programs/memewarzone_solana/src/authorized_trade.rs \
            frontend/api/dev-fix/solana-trade-preflight-final.test.mjs \
            frontend/src/lib/solanaV4CreateSubmit.ts \
            frontend/src/pages/Create.tsx \
            frontend/src/pages/PushDraftLive.tsx
          git commit -m "Finalize Solana preflight UX and policy tests"
          git push origin HEAD:agent/solana-final-launch-blockers
