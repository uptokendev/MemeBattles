name: Extract one-shot borrowed Context stage markers

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/solana-context-marker-diagnostic-once.yml

permissions:
  actions: read
  contents: read

jobs:
  extract-markers:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Download failed validator artifact
        uses: actions/download-artifact@v4
        with:
          name: memewarzone-solana-validator-d7ec17a2848a8f91018293185e14852371a5d235
          path: /tmp/validator-diagnostics
          run-id: 30382547301
          github-token: ${{ github.token }}

      - name: Print exact stage-marker sequence
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('/tmp/validator-diagnostics')
          log = next(root.rglob('solana-validator-acceptance.log'))
          lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
          markers = [line.strip() for line in lines if 'MW_CREATE_STAGE_' in line]
          overlap_lines = [line.strip() for line in lines if 'Overlapping copy' in line]
          print('MW_CONTEXT_STAGE_MARKERS=' + json.dumps(markers, ensure_ascii=True))
          print('MW_CONTEXT_OVERLAP_LINES=' + json.dumps(overlap_lines, ensure_ascii=True))
