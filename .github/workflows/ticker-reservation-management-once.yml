name: Wire ticker reservation management once

on:
  push:
    branches:
      - agent/solana-v2-ticker-reservations
    paths:
      - .github/workflows/ticker-reservation-management-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-ticker-reservations
          fetch-depth: 0

      - name: Patch server and frontend client
        shell: python
        run: |
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          server_path = Path('frontend/api/server.mjs')
          server = server_path.read_text(encoding='utf-8')
          server = replace_once(
              server,
              'import { tickerAvailability } from "./dev-fix/ticker-availability.js";\n',
              'import { tickerAvailability } from "./dev-fix/ticker-availability.js";\nimport { tickerReservationManagement } from "./dev-fix/ticker-reservations.js";\n',
              'server import',
          )
          server = replace_once(
              server,
              'router.all("/drafts/:draftId/promotion", wrap(draftPromotion));\n',
              'router.all("/drafts/:draftId/promotion", wrap(draftPromotion));\nrouter.all("/drafts/:draftId/ticker-reservation", wrap(tickerReservationManagement));\n',
              'server route',
          )
          server_path.write_text(server, encoding='utf-8')

          auth_path = Path('frontend/src/lib/draftAuth.ts')
          auth = auth_path.read_text(encoding='utf-8')
          auth = replace_once(
              auth,
              '  | "deploy_draft"\n',
              '  | "deploy_draft"\n  | "manage_ticker_reservation"\n',
              'frontend auth union',
          )
          auth = replace_once(
              auth,
              '  "deploy_draft",\n]);\n',
              '  "deploy_draft",\n  "manage_ticker_reservation",\n]);\n',
              'frontend owner session actions',
          )
          auth_path.write_text(auth, encoding='utf-8')

          api_path = Path('frontend/src/lib/draftApi.ts')
          api = api_path.read_text(encoding='utf-8')
          type_marker = 'export type DraftVisibility = "public" | "unlisted" | "private";\n'
          reservation_types = '''export type TickerReservationStatus =
            | "DRAFT_UNRESERVED"
            | "SOFT_RESERVED"
            | "PREPARE_MODE_RESERVED"
            | "SCHEDULED_UNARMED"
            | "ARM_AUTHORIZED"
            | "ARMING"
            | "ARMED_ONCHAIN"
            | "LIVE"
            | "DEPLOY_FAILED"
            | "EXPIRED_GRACE"
            | "RELEASED"
            | "SCHEDULE_MISSED";

          export type TickerReservation = {
            id: string;
            draftId: string | null;
            creatorWallet: string;
            chainId: number;
            cluster: string;
            originalTicker: string;
            normalizedTicker: string;
            tickerHash: string;
            reservationIdHash: string;
            status: TickerReservationStatus;
            reservedAt: string | null;
            publishedAt: string | null;
            expiresAt: string | null;
            graceEndAt: string | null;
            renewalCount: number;
            scheduledLaunchAt: string | null;
            armAuthorizedAt: string | null;
            armingAt: string | null;
            armedAt: string | null;
            liveAt: string | null;
            scheduleMissedAt: string | null;
            releasedAt: string | null;
            programId: string | null;
            generationId: string | null;
            campaignPda: string | null;
            mint: string | null;
            deploymentSignature: string | null;
            reservationVersion: string;
            authorizationNonce: string | null;
            failureReason: string | null;
            metadata: Record<string, unknown>;
            createdAt: string | null;
            updatedAt: string | null;
          };

          export type TickerReservationOperation = "read" | "renew" | "release" | "reclaim";

          export type TickerReservationManagementResult = {
            operation: TickerReservationOperation;
            draftId: string;
            ticker: string;
            chainId: number;
            reservation: TickerReservation | null;
            availableActions: Array<"renew" | "release" | "reclaim">;
          };

          '''
          api = replace_once(api, type_marker, reservation_types + type_marker, 'reservation types')
          api = replace_once(
              api,
              '  updatedAt: string;\n};\n\nexport type CampaignDraftPromotion',
              '  updatedAt: string;\n  tickerReservation?: TickerReservation | null;\n};\n\nexport type CampaignDraftPromotion',
              'draft reservation field',
          )
          api = replace_once(
              api,
              '''export type TickerAvailability = {
            ticker: string;
            chainId?: number;
            available: boolean;
            reason: string;
            source: "validation" | "draft" | "campaign" | "available" | string;
          };''',
              '''export type TickerAvailability = {
            ticker: string;
            chainId?: number;
            available: boolean;
            reason: string;
            source: "validation" | "draft" | "campaign" | "available" | string;
            reservation?: Pick<TickerReservation, "status" | "expiresAt" | "graceEndAt" | "renewalCount" | "scheduledLaunchAt" | "reservationVersion"> | null;
          };''',
              'ticker availability type',
          )
          api = replace_once(
              api,
              '''  const json = await parseJson(res);
            const draft = json.draft as CampaignDraft;
            cacheJustCreatedDraft(draft);
            return draft;''',
              '''  const json = await parseJson(res);
            const draft = {
              ...(json.draft as CampaignDraft),
              tickerReservation: (json.tickerReservation as TickerReservation | null | undefined) ?? json.draft?.tickerReservation ?? null,
            };
            cacheJustCreatedDraft(draft);
            return draft;''',
              'create response reservation',
          )

          insertion_marker = 'export async function archiveCampaignDraft(draftId: string, auth: DraftActionAuth): Promise<PrepareDraftBundle> {'
          management_function = '''export async function manageTickerReservation(input: {
            draftId: string;
            walletAddress: string;
            chainId: number;
            operation: TickerReservationOperation;
            auth?: DraftActionAuth | null;
          }): Promise<TickerReservationManagementResult> {
            const send = async (auth: DraftActionAuth) => {
              const res = await apiFetch(`/api/drafts/${encodeURIComponent(input.draftId)}/ticker-reservation`, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ operation: input.operation, auth }),
              });
              const json = await readResponseJson(res);
              return { res, json };
            };

            let auth = input.auth || await signDraftActionWithKnownChain({
              action: "manage_ticker_reservation",
              draftId: input.draftId,
              walletAddress: input.walletAddress,
              chainId: input.chainId,
              useOwnerSession: true,
            });
            let attempt = await send(auth);

            if (attempt.res.status === 401 && shouldRetryWithFreshOwnerSession(attempt.json)) {
              auth = await signDraftActionWithKnownChain({
                action: "manage_ticker_reservation",
                draftId: input.draftId,
                walletAddress: input.walletAddress,
                chainId: input.chainId,
                useOwnerSession: true,
                forceNewOwnerSession: true,
              });
              attempt = await send(auth);
            }

            if (!attempt.res.ok) {
              throw new Error(String(attempt.json?.error || attempt.json?.message || `Request failed (${attempt.res.status})`));
            }
            return attempt.json as TickerReservationManagementResult;
          }

          '''
          api = replace_once(api, insertion_marker, management_function + insertion_marker, 'management client')
          api = replace_once(
              api,
              '''  const json = await parseJson(res);
            return json.draft as CampaignDraft;
          }''',
              '''  const json = await parseJson(res);
            return {
              ...(json.draft as CampaignDraft),
              tickerReservation: (json.tickerReservation as TickerReservation | null | undefined) ?? json.draft?.tickerReservation ?? null,
            };
          }''',
              'deploy response reservation',
          )
          api_path.write_text(api, encoding='utf-8')

      - name: Verify patched sources
        shell: bash
        run: |
          node --check frontend/api/server.mjs
          node --check frontend/api/dev-fix/ticker-reservations.js
          node --check frontend/api/dev-fix/draft-auth.js
          git diff --check
          git diff --stat

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/api/server.mjs \
            frontend/src/lib/draftAuth.ts \
            frontend/src/lib/draftApi.ts
          git commit -m 'Expose creator ticker reservation management'
          git push origin HEAD:agent/solana-v2-ticker-reservations
