name: Indexer

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: indexer
  cancel-in-progress: false

jobs:
  run-indexer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Run indexer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          FACTORY_ADDRESS: ${{ secrets.FACTORY_ADDRESS }}
          CHAIN_ID: ${{ secrets.CHAIN_ID }}
          CONFIRMATIONS: ${{ secrets.CONFIRMATIONS }}
          START_BLOCK: ${{ secrets.START_BLOCK }}
        run: npm run indexer

  deploy-scheduled-cooldown:
    name: Deploy scheduled cooldown BSC Testnet factory
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      BSC_TESTNET_RPC: ${{ secrets.BSC_TESTNET_RPC }}
      BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
      DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
      PRIVATE_KEY_DEPLOY: ${{ secrets.PRIVATE_KEY_DEPLOY }}
      ACTIVE_SCHEDULED_FACTORY_ADDRESS: 0xF7872169265eCE4E4C93ef894F1635E84DC6F681
      QA_CREATOR_ADDRESS: 0x13ad79765e14927df2c554d9662bbe539e89c8e8

    steps:
      - name: Checkout main gate state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check one-time deployment gate
        id: gate
        shell: bash
        run: |
          if [ -f .github/deployment-gates/scheduled-cooldown-v1.txt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "One-time deployment gate is absent; deployment steps will be skipped."
          fi

      - name: Announce protected deployment run
        if: steps.gate.outputs.run == 'true'
        run: |
          gh pr comment 71 --repo "$GITHUB_REPOSITORY" --body "Scheduled cooldown factory deployment started from the registered Indexer workflow. Protected run ID: $GITHUB_RUN_ID. Source compilation, targeted factory tests, contract-size checks, and duplicate-deployment guards run before any contract transaction."

      - name: Checkout exact approved feature branch
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: uptokendev/MemeBattles
          ref: agent/fix-scheduled-cooldown-timezone
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            realtime-indexer/package-lock.json

      - name: Verify BSC Testnet deployment credentials
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "${BSC_TESTNET_RPC}${BSC_TESTNET_RPC_URL}" ]; then
            echo "Missing BSC_TESTNET_RPC or BSC_TESTNET_RPC_URL secret."
            exit 1
          fi
          if [ -z "${DEPLOYER_PK}${PRIVATE_KEY_DEPLOY}" ]; then
            echo "Missing DEPLOYER_PK or PRIVATE_KEY_DEPLOY secret."
            exit 1
          fi

      - name: Prepare duplicate-safe deployment source
        if: steps.gate.outputs.run == 'true'
        run: |
          node --check scripts/prepare-scheduled-cooldown-deployment.mjs
          node scripts/prepare-scheduled-cooldown-deployment.mjs

      - name: Install and verify contract source
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run compile
          npx hardhat test test/LaunchFactory.spec.ts
          npm run size

      - name: Deploy and activate factory-only replacement
        if: steps.gate.outputs.run == 'true'
        id: deploy
        run: npx hardhat run scripts/deploy-scheduled-cooldown-factory.ts --network bscTestnet

      - name: Sync frontend ABI
        if: steps.gate.outputs.run == 'true'
        run: npm run sync:frontend-abis

      - name: Restore permanent feature workflows and remove one-time triggers
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          cat > .github/workflows/frontend-pr-proof.yml <<'FRONTEND_YAML'
          name: frontend pull request proof

          on:
            pull_request:
              branches:
                - devpostgrad
              paths:
                - frontend/**
                - .github/workflows/frontend-pr-proof.yml

          permissions:
            contents: read

          concurrency:
            group: frontend-pr-proof-${{ github.event.pull_request.number }}
            cancel-in-progress: true

          jobs:
            frontend:
              name: frontend imports and production build
              runs-on: ubuntu-latest
              timeout-minutes: 25

              steps:
                - name: Checkout pull request source
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

                - name: Install frontend dependencies
                  run: npm ci --prefix frontend

                - name: Check lifecycle API module syntax
                  run: |
                    node --check frontend/api/campaigns.js
                    node --check frontend/api/campaigns-base.js
                    node --check frontend/api/featured.js
                    node --check frontend/api/dev-fix/drafts.js
                    node --check frontend/api/dev-fix/drafts-base.js
                    node --check frontend/api/dev-fix/draft-read.js
                    node --check frontend/api/dev-fix/draft-read-base.js
                    node --check frontend/api/dev-fix/draft-deploy.js
                    node --check frontend/api/dev-fix/draft-deploy-base.js
                    node --check frontend/api/dev-fix/json-transform.js
                    node --check frontend/api/dev-fix/scheduled-lifecycle.js

                - name: Test scheduled lifecycle timestamp transitions
                  run: node --test frontend/api/dev-fix/scheduled-lifecycle.test.mjs

                - name: Check API imports
                  run: npm --prefix frontend run check:api-imports

                - name: Test wallet provider discovery
                  run: npm --prefix frontend run test:wallet-discovery

                - name: Build public application
                  run: npm --prefix frontend run build
          FRONTEND_YAML

          cat > .github/workflows/ticker-reservation-ci.yml <<'TICKER_YAML'
          name: Ticker Reservation CI

          on:
            pull_request:
              branches:
                - devpostgrad
                - agent/scheduled-launch-lifecycle
              paths:
                - db/migrations/*ticker_reservation*.sql
                - frontend/api/dev-fix/draft-auth.js
                - frontend/api/dev-fix/draft-deploy-base.js
                - frontend/api/dev-fix/drafts-base.js
                - frontend/api/dev-fix/drafts.js
                - frontend/api/dev-fix/ticker-availability.js
                - frontend/api/dev-fix/ticker-reservation-service.js
                - frontend/api/dev-fix/ticker-reservation-service.test.mjs
                - frontend/api/dev-fix/ticker-reservations.js
                - frontend/api/server.mjs
                - frontend/src/lib/draftApi.ts
                - frontend/src/lib/draftAuth.ts
                - .github/workflows/ticker-reservation-ci.yml
            push:
              branches:
                - agent/solana-v2-ticker-reservations
              paths:
                - db/migrations/*ticker_reservation*.sql
                - frontend/api/dev-fix/draft-auth.js
                - frontend/api/dev-fix/draft-deploy-base.js
                - frontend/api/dev-fix/drafts-base.js
                - frontend/api/dev-fix/drafts.js
                - frontend/api/dev-fix/ticker-availability.js
                - frontend/api/dev-fix/ticker-reservation-service.js
                - frontend/api/dev-fix/ticker-reservation-service.test.mjs
                - frontend/api/dev-fix/ticker-reservations.js
                - frontend/api/server.mjs
                - frontend/src/lib/draftApi.ts
                - frontend/src/lib/draftAuth.ts
                - .github/workflows/ticker-reservation-ci.yml
            workflow_dispatch:

          concurrency:
            group: ticker-reservations-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          permissions:
            contents: read

          jobs:
            validate:
              name: Reservation service, auth and frontend build
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Use Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

                - name: Install frontend dependencies
                  run: npm ci --prefix frontend --no-audit --no-fund

                - name: Verify API source syntax
                  run: |
                    node --check frontend/api/server.mjs
                    node --check frontend/api/dev-fix/draft-auth.js
                    node --check frontend/api/dev-fix/draft-deploy-base.js
                    node --check frontend/api/dev-fix/drafts-base.js
                    node --check frontend/api/dev-fix/drafts.js
                    node --check frontend/api/dev-fix/ticker-availability.js
                    node --check frontend/api/dev-fix/ticker-reservation-service.js
                    node --check frontend/api/dev-fix/ticker-reservations.js

                - name: Test ticker reservation service
                  run: node --test frontend/api/dev-fix/ticker-reservation-service.test.mjs

                - name: Test draft owner authentication
                  run: npm --prefix frontend run test:draft-auth

                - name: Build production frontend
                  run: npm --prefix frontend run build

                - name: Verify repository diff
                  run: git diff --check
          TICKER_YAML

          git fetch origin devpostgrad --depth=1
          git checkout origin/devpostgrad -- frontend/yarn.lock 2>/dev/null || true
          rm -f scripts/prepare-scheduled-cooldown-deployment.mjs
          rm -f frontend/src/__trigger-scheduled-cooldown-deployment.ts

      - name: Validate API and frontend against active replacement
        if: steps.gate.outputs.run == 'true'
        run: |
          node --check frontend/api/dev-fix/security.js
          node --check frontend/api/dev-fix/draft-deploy-base.js
          node --check frontend/api/dev-fix/draft-deploy.js
          npm ci --prefix frontend --no-audit --no-fund
          npm --prefix frontend run check:api-imports
          npm --prefix frontend run test:wallet-discovery
          npm --prefix frontend run build

      - name: Validate realtime indexer against active replacement
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci --prefix realtime-indexer --no-audit --no-fund
          npm --prefix realtime-indexer run build

      - name: Publish deployment manifest and active pointers
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          test -f deployments/bscTestnet.scheduled-cooldown-factory.json
          test -f deployments/bscTestnet.scheduled-cooldown-factory.env
          git diff --check
          git config user.name "MemeWarzone Deployment Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Deployment produced no repository changes."
            exit 1
          fi
          git commit -m "Activate scheduled cooldown factory on BSC Testnet"
          git push origin HEAD:agent/fix-scheduled-cooldown-timezone

      - name: Restore main Indexer workflow and remove temporary gates
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git fetch origin main
          git switch -C scheduled-cooldown-main-cleanup origin/main
          cat > .github/workflows/indexer.yml <<'INDEXER_YAML'
          name: Indexer

          on:
            schedule:
              - cron: "2-59/5 * * * *"
            workflow_dispatch: {}

          concurrency:
            group: indexer
            cancel-in-progress: false

          jobs:
            run-indexer:
              runs-on: ubuntu-latest
              timeout-minutes: 20

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: "20"
                    cache: "npm"

                - name: Install
                  run: npm ci

                - name: Run indexer
                  env:
                    DATABASE_URL: ${{ secrets.DATABASE_URL }}
                    BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
                    FACTORY_ADDRESS: ${{ secrets.FACTORY_ADDRESS }}
                    CHAIN_ID: ${{ secrets.CHAIN_ID }}
                    CONFIRMATIONS: ${{ secrets.CONFIRMATIONS }}
                    START_BLOCK: ${{ secrets.START_BLOCK }}
                  run: npm run indexer
          INDEXER_YAML
          rm -f .github/deployment-gates/scheduled-cooldown-v1.txt
          rm -f .github/workflows/scheduled-cooldown-command-gate.yml
          rm -f .github/workflows/scheduled-cooldown-push-gate.yml
          rm -f .github/workflows/scheduled-cooldown-main-pr-gate.yml
          git add -A
          git config user.name "MemeWarzone Deployment Agent"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time scheduled cooldown deployment gates"
            git push origin HEAD:main
          fi

      - name: Comment successful deployment details
        if: success() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git switch agent/fix-scheduled-cooldown-timezone 2>/dev/null || git switch -C agent/fix-scheduled-cooldown-timezone origin/agent/fix-scheduled-cooldown-timezone
          FACTORY="$(node -p "require('./deployments/bscTestnet.scheduled-cooldown-factory.json').activeFactory.address")"
          LOCKER="$(node -p "require('./deployments/bscTestnet.scheduled-cooldown-factory.json').activeFactory.permanentLpLocker")"
          TX="$(node -p "require('./deployments/bscTestnet.scheduled-cooldown-factory.json').deploymentTxHash")"
          BLOCK="$(node -p "require('./deployments/bscTestnet.scheduled-cooldown-factory.json').deploymentBlock")"
          gh pr comment 71 --repo "$GITHUB_REPOSITORY" --body "Scheduled cooldown factory deployment completed successfully. Factory: \`$FACTORY\`. Permanent LP locker: \`$LOCKER\`. Deployment transaction: \`$TX\`. Deployment block: \`$BLOCK\`. The old factory is creation-paused while its existing campaign remains supported. Protected run ID: $GITHUB_RUN_ID."

      - name: Comment deployment failure
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          gh pr comment 71 --repo "$GITHUB_REPOSITORY" --body "Scheduled cooldown factory deployment failed before the full acceptance gate completed. Protected run ID: $GITHUB_RUN_ID. The duplicate guard prevents a second replacement if activation already occurred; inspect this run before retrying."
