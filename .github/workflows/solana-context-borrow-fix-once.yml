name: Apply one-shot Solana Context borrow fix

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/solana-context-borrow-fix-once.yml

permissions:
  contents: write

jobs:
  patch-source:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-phase0-refresh
          fetch-depth: 0

      - name: Borrow the large create Context instead of forwarding it by value
        shell: python
        run: |
          from pathlib import Path

          create_path = Path('programs/memewarzone_solana/src/authorized_create.rs')
          create_source = create_path.read_text(encoding='utf-8')
          old_handler = '''pub fn create_campaign_handler(
              ctx: Context<CreateCampaign>,
              args: CreateCampaignArgs,
          ) -> Result<()> {'''
          new_handler = '''pub fn create_campaign_handler(
              ctx: &mut Context<CreateCampaign>,
              args: CreateCampaignArgs,
          ) -> Result<()> {'''
          if create_source.count(old_handler) != 1:
              raise SystemExit(
                  f'Expected one by-value create handler, found {create_source.count(old_handler)}'
              )
          create_source = create_source.replace(old_handler, new_handler, 1)
          create_path.write_text(create_source, encoding='utf-8')

          lib_path = Path('programs/memewarzone_solana/src/lib.rs')
          lib_source = lib_path.read_text(encoding='utf-8')
          old_entry = '''    pub fn create_campaign(
                  ctx: Context<CreateCampaign>,
                  args: CreateCampaignArgs,
              ) -> Result<()> {
                  authorized_create::create_campaign_handler(ctx, args)
              }'''
          new_entry = '''    pub fn create_campaign(
                  mut ctx: Context<CreateCampaign>,
                  args: CreateCampaignArgs,
              ) -> Result<()> {
                  authorized_create::create_campaign_handler(&mut ctx, args)
              }'''
          if lib_source.count(old_entry) != 1:
              raise SystemExit(
                  f'Expected one by-value create entrypoint, found {lib_source.count(old_entry)}'
              )
          lib_source = lib_source.replace(old_entry, new_entry, 1)
          lib_path.write_text(lib_source, encoding='utf-8')

      - name: Format and verify patch
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          git diff -- \
            programs/memewarzone_solana/src/authorized_create.rs \
            programs/memewarzone_solana/src/lib.rs

      - name: Commit Context borrow fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            programs/memewarzone_solana/src/authorized_create.rs \
            programs/memewarzone_solana/src/lib.rs
          git commit -m 'Borrow Solana create Context across helper boundary'
          git push origin HEAD:agent/solana-v2-phase0-refresh
