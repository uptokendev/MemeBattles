name: Canonical MCap diff cleanup once

on:
  push:
    branches: [agent/canonical-mcap-surfaces]
    paths: [.github/workflows/canonical-mcap-lineendings-once.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-mcap-surfaces
          fetch-depth: 0
      - name: Restore CRLF files and reapply minimal edits
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          files = [
            'frontend/src/components/home/FeaturedCampaigns.tsx',
            'frontend/src/components/ui/horizontal-scroll-carousel.tsx',
          ]
          subprocess.run(['git','checkout','origin/devpostgrad','--',*files], check=True)

          def edit_bytes(path, replacements):
              p = Path(path)
              raw = p.read_bytes()
              text = raw.decode('utf-8')
              nl = '\r\n' if '\r\n' in text else '\n'
              for old, new, expected in replacements:
                  old = old.replace('\n', nl)
                  new = new.replace('\n', nl)
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected}, found {count}: {old[:100]!r}')
                  text = text.replace(old, new)
              p.write_bytes(text.encode('utf-8'))

          edit_bytes('frontend/src/components/home/FeaturedCampaigns.tsx', [
            ('import { useBnbUsdPrice } from "@/hooks/useBnbUsdPrice";', 'import { useNativeUsdPrice } from "@/hooks/useNativeUsdPrice";', 1),
            ('  const { price: bnbUsd } = useBnbUsdPrice(true);', '  const { price: nativeUsd } = useNativeUsdPrice(featuredChainId);', 1),
            ('      const mcapBnb = Number((patch as { marketcapBnb?: string | number }).marketcapBnb ?? it.marketcapBnb ?? NaN);\n      const mcapUsdLabel = Number.isFinite(mcapBnb) && bnbUsd ? formatCompactUsd(mcapBnb * bnbUsd) : null;', '      // Canonical REST value wins; legacy realtime marketcap is fallback only.\n      const mcapBnb = Number(it.marketcapBnb ?? (patch as { marketcapBnb?: string | number }).marketcapBnb ?? NaN);\n      const mcapUsdLabel = Number.isFinite(mcapBnb) && nativeUsd ? formatCompactUsd(mcapBnb * nativeUsd) : null;', 1),
            ('  }, [items, patchByCampaign, bnbUsd, logoCache, voteMode, featuredChainId]);', '  }, [items, patchByCampaign, nativeUsd, logoCache, voteMode, featuredChainId]);', 1),
          ])

          edit_bytes('frontend/src/components/ui/horizontal-scroll-carousel.tsx', [
            ('import { useBnbUsdPrice } from "@/hooks/useBnbUsdPrice";', 'import { useNativeUsdPrice } from "@/hooks/useNativeUsdPrice";', 1),
            ('  const { price: bnbUsdPrice } = useBnbUsdPrice(true);', '  const { price: nativeUsdPrice } = useNativeUsdPrice(chainIdForStorage);', 1),
            ('            // Convert "X BNB" -> USD label for UI + ATH tracking\n            let marketCapUsdLabel: string | null = null;\n            const mcBnb = marketCapLabel.toUpperCase().includes("BNB")\n              ? parseCompactNumber(marketCapLabel.replace(/BNB/i, "").trim())\n              : null;\n            if (mcBnb != null && bnbUsdPrice && Number.isFinite(Number(bnbUsdPrice))) {\n              marketCapUsdLabel = formatCompactUsd(mcBnb * Number(bnbUsdPrice));\n            }', '            // Convert the selected chain-native market cap (BNB or SOL) to USD.\n            let marketCapUsdLabel: string | null = null;\n            const nativeSymbol = isSolanaChainId(chainIdForStorage) ? "SOL" : "BNB";\n            const nativePattern = new RegExp(nativeSymbol, "i");\n            const mcNative = marketCapLabel.toUpperCase().includes(nativeSymbol)\n              ? parseCompactNumber(marketCapLabel.replace(nativePattern, "").trim())\n              : null;\n            if (mcNative != null && nativeUsdPrice && Number.isFinite(Number(nativeUsdPrice))) {\n              marketCapUsdLabel = formatCompactUsd(mcNative * Number(nativeUsdPrice));\n            }', 1),
            ('  }, [fetchCampaigns, fetchCampaignCardStats, bnbUsdPrice]);', '  }, [fetchCampaigns, fetchCampaignCardStats, nativeUsdPrice, chainIdForStorage]);', 1),
            ('            let marketCapUsdLabel: string | null = null;\n            const mcBnb = marketCapLabel.toUpperCase().includes("BNB")\n              ? parseCompactNumber(marketCapLabel.replace(/BNB/i, "").trim())\n              : null;\n            if (mcBnb != null && bnbUsdPrice && Number.isFinite(Number(bnbUsdPrice))) {\n              marketCapUsdLabel = formatCompactUsd(mcBnb * Number(bnbUsdPrice));\n            }', '            let marketCapUsdLabel: string | null = null;\n            const nativeSymbol = isSolanaChainId(chainIdForStorage) ? "SOL" : "BNB";\n            const nativePattern = new RegExp(nativeSymbol, "i");\n            const mcNative = marketCapLabel.toUpperCase().includes(nativeSymbol)\n              ? parseCompactNumber(marketCapLabel.replace(nativePattern, "").trim())\n              : null;\n            if (mcNative != null && nativeUsdPrice && Number.isFinite(Number(nativeUsdPrice))) {\n              marketCapUsdLabel = formatCompactUsd(mcNative * Number(nativeUsdPrice));\n            }', 1),
            ('  }, [fetchCampaignCardStats, bnbUsdPrice]);', '  }, [fetchCampaignCardStats, nativeUsdPrice, chainIdForStorage]);', 1),
          ])

          subprocess.run(['git','rm','.github/workflows/canonical-mcap-lineendings-once.yml'], check=True)
      - name: Verify focused diff and build
        run: |
          git diff --check origin/devpostgrad...HEAD || true
          npm ci --prefix frontend
          npm --prefix frontend run build
          npm --prefix frontend run lint
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/home/FeaturedCampaigns.tsx frontend/src/components/ui/horizontal-scroll-carousel.tsx
          git commit -am "Preserve MCap surface file line endings"
          git push origin HEAD:agent/canonical-mcap-surfaces