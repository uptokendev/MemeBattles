name: Agent professional chart cleanup

on:
  push:
    branches:
      - agent/professional-chart-launch
    paths:
      - .github/workflows/agent-professional-chart-finalize.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/professional-chart-launch
          fetch-depth: 0
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-professional-chart-finalize.yml
          git commit -m "Remove temporary chart finalization runner"
          git push origin HEAD:agent/professional-chart-launch
