name: WTR handoff safety patch

on:
  push:
    branches:
      - agent/war-trade-room-continuity-foundation
    paths:
      - .github/workflows/wtr-handoff-safety-patch.yml

permissions:
  contents: write

concurrency:
  group: wtr-handoff-safety-patch
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/war-trade-room-continuity-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: realtime-indexer/package-lock.json

      - name: Patch degraded pool stability persistence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('realtime-indexer/src/marketContinuity.ts')
          text = path.read_text()
          old = '''          stable,
          feeBps,
          snapshot.finalCurvePriceRaw,'''
          new = '''          verification.routeVerified ? false : null,
          feeBps,
          snapshot.finalCurvePriceRaw,'''
          if old not in text:
              if new in text:
                  print('Safety patch already applied.')
              else:
                  raise SystemExit('Expected handoff persistence target not found.')
          else:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate indexer and frontend
        run: |
          npm ci --prefix realtime-indexer --no-audit --no-fund
          npm --prefix realtime-indexer run test:wtr
          npm --prefix realtime-indexer run build
          npm ci --prefix frontend --no-audit --no-fund
          npm --prefix frontend run build

      - name: Commit safety patch and latest validation markers
        shell: bash
        run: |
          mkdir -p .github/validation
          cat > .github/validation/wtr-indexer-validation.txt <<EOF
          WTR indexer validation passed
          validation_revision=market_continuity_v4
          validated_source_sha=${GITHUB_SHA}
          node=20
          install_status=0
          test_status=0
          build_status=0
          EOF
          cat > .github/validation/wtr-frontend-validation.txt <<EOF
          WTR frontend validation passed
          validation_revision=unified_chart_topaz_trading_v4
          validated_source_sha=${GITHUB_SHA}
          node=20
          install_status=0
          build_status=0
          EOF
          rm .github/workflows/wtr-handoff-safety-patch.yml
          git config user.name "MemeWarzone Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(wtr): harden degraded handoff persistence"
          git push origin HEAD:agent/war-trade-room-continuity-foundation
