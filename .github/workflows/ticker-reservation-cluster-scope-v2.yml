name: Ticker Reservation Cluster Scope V2

on:
  pull_request:
    branches:
      - agent/scheduled-launch-lifecycle
      - devpostgrad
    paths:
      - .github/workflows/ticker-reservation-cluster-scope-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-ticker-reservations
          fetch-depth: 0

      - name: Execute reviewed patch with robust availability matcher
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/ticker-reservation-cluster-scope-once.yml').read_text(encoding='utf-8')
          start_marker = '''      - name: Patch cluster-scoped reservation source
                  shell: python
                  run: |
          '''
          end_marker = '''
                - name: Verify patched sources
          '''
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])

          label_position = script.index("'availability cluster query'")
          block_start = script.rfind('service = replace_once(', 0, label_position)
          block_end = script.index('\n)', label_position) + 2
          robust_block = dedent('''\
          availability_start = service.index(
              '  await refreshExpiredTickerReservations(db, { chainId: numericChainId, normalizedTicker });'
          )
          availability_end = service.index('\n}\n\nfunction reservationTerms', availability_start)
          availability_replacement = chr(10).join([
              '  const reservationCluster = canonicalClusterForChain(numericChainId, cluster);',
              '  await refreshExpiredTickerReservations(db, {',
              '    chainId: numericChainId,',
              '    cluster: reservationCluster,',
              '    normalizedTicker,',
              '  });',
              '  const result = await db.query(',
              '    `select *',
              '       from public.ticker_reservations',
              '      where chain_id = $1',
              '        and cluster = $2',
              '        and normalized_ticker = $3',
              "        and status not in ('DRAFT_UNRESERVED', 'RELEASED')",
              '        and ($4::uuid is null or draft_id is distinct from $4::uuid)',
              '      order by created_at asc',
              '      limit 1`,',
              '    [numericChainId, reservationCluster, normalizedTicker, excludeDraftId || null],',
              '  );',
              '  const reservation = mapTickerReservationRow(result.rows[0]);',
              '  return {',
              '    ticker: normalizedTicker,',
              '    chainId: numericChainId,',
              '    cluster: reservationCluster,',
              '    available: !reservation,',
              '    reservation,',
              '  };',
          ])
          service = service[:availability_start] + availability_replacement + service[availability_end:]
          ''')
          script = script[:block_start] + robust_block + script[block_end:]

          compile(script, 'ticker-reservation-cluster-scope-v2', 'exec')
          exec(script, {})

      - name: Verify patched sources
        shell: bash
        run: |
          node --check frontend/api/dev-fix/ticker-reservation-service.js
          node --check frontend/api/dev-fix/ticker-availability.js
          node --check frontend/api/dev-fix/ticker-reservations.js
          node --test frontend/api/dev-fix/ticker-reservation-service.test.mjs
          git diff --check
          git diff --stat

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/api/dev-fix/ticker-reservation-service.js \
            frontend/api/dev-fix/ticker-availability.js \
            frontend/api/dev-fix/ticker-reservations.js \
            frontend/src/lib/draftApi.ts \
            frontend/api/dev-fix/ticker-reservation-service.test.mjs
          git commit -m 'Scope ticker reservations by chain cluster'
          git push origin HEAD:agent/solana-v2-ticker-reservations
