name: Inspect scheduled factory replacement

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/inspect-scheduled-factory-replacement.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-scheduled-cooldown-timezone
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: List BSC Testnet deployment artifacts
        run: find deployments -maxdepth 3 -type f -print | sort
      - name: Read active factory, registry, treasury and locker state
        shell: bash
        run: |
          node <<'NODE'
          const { ethers } = require('ethers');

          const activeFactoryAddress = '0xF7872169265eCE4E4C93ef894F1635E84DC6F681';
          const creator = '0x13ad79765e14927df2c554d9662bbe539e89c8e8';
          const urls = [
            'https://data-seed-prebsc-1-s1.bnbchain.org:8545',
            'https://bsc-testnet-dataseed.bnbchain.org',
            'https://bsc-testnet-rpc.publicnode.com',
          ];
          const factoryAbi = [
            'function owner() view returns (address)',
            'function live() view returns (bool)',
            'function globalPaused() view returns (bool)',
            'function createPaused() view returns (bool)',
            'function router() view returns (address)',
            'function feeRecipient() view returns (address)',
            'function leagueReceiver() view returns (address)',
            'function campaignImplementation() view returns (address)',
            'function graduationOracle() view returns (address)',
            'function creatorRegistry() view returns (address)',
            'function riskRegistry() view returns (address)',
            'function routeAuthority() view returns (address)',
            'function tradeRouteProfile() view returns (uint8)',
            'function finalizeRouteProfile() view returns (uint8)',
            'function protocolFeeBps() view returns (uint256)',
            'function requireAuthorizedTrading() view returns (bool)',
            'function requireRouteAuthorization() view returns (bool)',
            'function securityDefaultsLocked() view returns (bool)',
            'function config() view returns (uint256 totalSupply,uint256 curveBps,uint256 liquidityTokenBps,uint256 basePrice,uint256 priceSlope,uint256 graduationTarget,uint256 liquidityBps)',
            'function launchProtectionConfig() view returns (uint256 blocks_,uint256 maxBuyWei,uint256 maxWalletWei)',
            'function permanentLpLocker() view returns (address)',
            'function campaignsCount() view returns (uint256)',
          ];
          const registryAbi = [
            'function owner() view returns (address)',
            'function launchRecorder(address) view returns (bool)',
            'function getCreatorProfile(address) view returns (uint8 tier,uint256 trustScore,uint256 liveBondingCount,uint256 lastLaunchTimestamp,bool restricted,bool manualReviewRequired)',
            'function getCreatorRules(address) view returns (uint256 maxLiveBonding,uint256 cooldownSeconds,uint256 creatorBuyLockSeconds,uint256 creatorBuyCapWei,uint256 maxClusterWallets)',
          ];
          const treasuryAbi = [
            'function admin() view returns (address)',
            'function owner() view returns (address)',
            'function forwardingPaused() view returns (bool)',
            'function authorizedLpLocker(address) view returns (bool)',
            'function permanentLpLocker() view returns (address)',
            'function weeklyLeagueVault() view returns (address)',
            'function monthlyLeagueTreasury() view returns (address)',
            'function recruiterRewardsVault() view returns (address)',
            'function communityRewardsVault() view returns (address)',
            'function protocolRevenueVault() view returns (address)',
          ];
          const routerAbi = [
            'function poolFactory() view returns (address)',
            'function WETH() view returns (address)',
          ];

          async function connect() {
            for (const url of urls) {
              try {
                const provider = new ethers.JsonRpcProvider(url, 97, { staticNetwork: true });
                const block = await provider.getBlockNumber();
                console.log('RPC', url, 'block', block);
                return provider;
              } catch (error) {
                console.warn('RPC failed', url, error.shortMessage || error.message);
              }
            }
            throw new Error('No BSC Testnet RPC available');
          }

          const printable = (value) => {
            if (typeof value === 'bigint') return value.toString();
            if (Array.isArray(value)) return value.map(printable);
            if (value && typeof value === 'object') {
              const out = {};
              for (const [key, item] of Object.entries(value)) {
                if (!/^\d+$/.test(key)) out[key] = printable(item);
              }
              return Object.keys(out).length ? out : String(value);
            }
            return value;
          };

          async function optional(contract, method, ...args) {
            try { return printable(await contract[method](...args)); }
            catch (error) { return `UNAVAILABLE: ${error.shortMessage || error.message}`; }
          }

          (async () => {
            const provider = await connect();
            const factory = new ethers.Contract(activeFactoryAddress, factoryAbi, provider);
            const state = {};
            for (const method of [
              'owner','live','globalPaused','createPaused','router','feeRecipient','leagueReceiver',
              'campaignImplementation','graduationOracle','creatorRegistry','riskRegistry','routeAuthority',
              'tradeRouteProfile','finalizeRouteProfile','protocolFeeBps','requireAuthorizedTrading',
              'requireRouteAuthorization','securityDefaultsLocked','config','launchProtectionConfig',
              'permanentLpLocker','campaignsCount'
            ]) state[method] = await optional(factory, method);
            console.log('ACTIVE_FACTORY_STATE', JSON.stringify(state, null, 2));

            const registryAddress = await factory.creatorRegistry();
            const registry = new ethers.Contract(registryAddress, registryAbi, provider);
            console.log('CREATOR_REGISTRY_STATE', JSON.stringify({
              address: registryAddress,
              owner: await optional(registry, 'owner'),
              activeFactoryRecorder: await optional(registry, 'launchRecorder', activeFactoryAddress),
              creatorProfile: await optional(registry, 'getCreatorProfile', creator),
              creatorRules: await optional(registry, 'getCreatorRules', creator),
            }, null, 2));

            const treasuryAddress = await factory.feeRecipient();
            const treasury = new ethers.Contract(treasuryAddress, treasuryAbi, provider);
            const oldLocker = await factory.permanentLpLocker();
            console.log('TREASURY_STATE', JSON.stringify({
              address: treasuryAddress,
              admin: await optional(treasury, 'admin'),
              owner: await optional(treasury, 'owner'),
              forwardingPaused: await optional(treasury, 'forwardingPaused'),
              oldLocker,
              oldLockerAuthorized: await optional(treasury, 'authorizedLpLocker', oldLocker),
              permanentLpLocker: await optional(treasury, 'permanentLpLocker'),
              weeklyLeagueVault: await optional(treasury, 'weeklyLeagueVault'),
              monthlyLeagueTreasury: await optional(treasury, 'monthlyLeagueTreasury'),
              recruiterRewardsVault: await optional(treasury, 'recruiterRewardsVault'),
              communityRewardsVault: await optional(treasury, 'communityRewardsVault'),
              protocolRevenueVault: await optional(treasury, 'protocolRevenueVault'),
            }, null, 2));

            const topazAddress = await factory.router();
            const topaz = new ethers.Contract(topazAddress, routerAbi, provider);
            console.log('TOPAZ_STATE', JSON.stringify({
              address: topazAddress,
              poolFactory: await optional(topaz, 'poolFactory'),
              wrappedNative: await optional(topaz, 'WETH'),
            }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
