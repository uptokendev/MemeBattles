name: Apply one-shot Solana create stage markers

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/solana-create-stage-markers-once.yml

permissions:
  contents: write

jobs:
  patch-source:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-phase0-refresh
          fetch-depth: 0

      - name: Add create-handler stage markers
        shell: python
        run: |
          from pathlib import Path

          path = Path('programs/memewarzone_solana/src/authorized_create.rs')
          source = path.read_text(encoding='utf-8')

          if 'MW_CREATE_STAGE_01_START' in source:
              print('Stage markers already present.')
              raise SystemExit(0)

          replacements = [
              (
                  '    let route_signer = ctx.accounts.global_config.route_signer;\n',
                  '    let route_signer = ctx.accounts.global_config.route_signer;\n'
                  '    msg!("MW_CREATE_STAGE_01_START");\n',
              ),
              (
                  '    validate_create_risk_profiles(\n'
                  '        creator_key,\n'
                  '        &ctx.accounts.risk_profile,\n'
                  '        &ctx.accounts.cluster_profile,\n'
                  '    )?;\n',
                  '    validate_create_risk_profiles(\n'
                  '        creator_key,\n'
                  '        &ctx.accounts.risk_profile,\n'
                  '        &ctx.accounts.cluster_profile,\n'
                  '    )?;\n'
                  '    msg!("MW_CREATE_STAGE_02_VALIDATED");\n',
              ),
              (
                  '    let allocation = calculate_token_allocation(\n'
                  '        ctx.accounts.generation_config.token_total_supply,\n'
                  '        ctx.accounts.generation_config.curve_supply_bps,\n'
                  '        ctx.accounts.generation_config.liquidity_token_bps,\n'
                  '    )?;\n',
                  '    let allocation = calculate_token_allocation(\n'
                  '        ctx.accounts.generation_config.token_total_supply,\n'
                  '        ctx.accounts.generation_config.curve_supply_bps,\n'
                  '        ctx.accounts.generation_config.liquidity_token_bps,\n'
                  '    )?;\n'
                  '    msg!("MW_CREATE_STAGE_03_ALLOCATED");\n',
              ),
              (
                  '        &args,\n'
                  '    );\n\n'
                  '    // The canonical payload remains fully bound, but only its compact SHA-256\n',
                  '        &args,\n'
                  '    );\n'
                  '    msg!("MW_CREATE_STAGE_04_MESSAGE_BUILT");\n\n'
                  '    // The canonical payload remains fully bound, but only its compact SHA-256\n',
              ),
              (
                  '    let authorization_hash = hash(&authorization_message).to_bytes();\n',
                  '    let authorization_hash = hash(&authorization_message).to_bytes();\n'
                  '    msg!("MW_CREATE_STAGE_05_HASHED");\n',
              ),
              (
                  '        &authorization_hash,\n'
                  '    )?;\n\n'
                  '    {\n'
                  '        let generation = &ctx.accounts.generation_config;\n',
                  '        &authorization_hash,\n'
                  '    )?;\n'
                  '    msg!("MW_CREATE_STAGE_06_AUTHORIZED");\n\n'
                  '    {\n'
                  '        let generation = &ctx.accounts.generation_config;\n',
              ),
              (
                  '        campaign.sol_vault_bump = ctx.bumps.sol_vault;\n'
                  '    }\n\n'
                  '    {\n'
                  '        let sol_vault = &mut ctx.accounts.sol_vault;\n',
                  '        campaign.sol_vault_bump = ctx.bumps.sol_vault;\n'
                  '    }\n'
                  '    msg!("MW_CREATE_STAGE_07_CAMPAIGN_STATE");\n\n'
                  '    {\n'
                  '        let sol_vault = &mut ctx.accounts.sol_vault;\n',
              ),
              (
                  '        sol_vault.bump = ctx.bumps.sol_vault;\n'
                  '    }\n\n'
                  '    let campaign_bump_seed = [ctx.bumps.campaign];\n',
                  '        sol_vault.bump = ctx.bumps.sol_vault;\n'
                  '    }\n'
                  '    msg!("MW_CREATE_STAGE_08_SOL_VAULT_STATE");\n\n'
                  '    let campaign_bump_seed = [ctx.bumps.campaign];\n',
              ),
              (
                  '    let campaign_signer = &[campaign_signer_seeds];\n\n'
                  '    token::mint_to(\n',
                  '    let campaign_signer = &[campaign_signer_seeds];\n'
                  '    msg!("MW_CREATE_STAGE_09_BEFORE_MINT");\n\n'
                  '    token::mint_to(\n',
              ),
              (
                  '        ctx.accounts.generation_config.token_total_supply,\n'
                  '    )?;\n\n'
                  '    ctx.accounts.mint.reload()?;\n',
                  '        ctx.accounts.generation_config.token_total_supply,\n'
                  '    )?;\n'
                  '    msg!("MW_CREATE_STAGE_10_MINTED");\n\n'
                  '    ctx.accounts.mint.reload()?;\n',
              ),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'Expected one stage-marker insertion point, found {source.count(old)}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')

      - name: Format and verify patch
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          git diff -- programs/memewarzone_solana/src/authorized_create.rs

      - name: Commit stage markers
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/memewarzone_solana/src/authorized_create.rs
          git commit -m 'Trace Solana create runtime stages'
          git push origin HEAD:agent/solana-v2-phase0-refresh
