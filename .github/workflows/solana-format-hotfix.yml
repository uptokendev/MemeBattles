name: Format Solana Hotfix

on:
  push:
    branches:
      - hotfix/solana-mainnet-transaction-normalization
    paths:
      - .github/workflows/solana-format-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.79.0 --profile minimal
          rustup component add rustfmt --toolchain 1.79.0
      - name: Format authorized trade hotfix only
        shell: bash
        run: |
          set -euo pipefail
          target='programs/memewarzone_solana/src/authorized_trade.rs'
          rustfmt +1.79.0 --edition 2021 "$target"
          git diff --check
          if git diff --quiet -- "$target"; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'MemeWarzone Launch Bot'
          git config user.email 'launch-bot@users.noreply.github.com'
          git add -- "$target"
          git diff --cached --check
          git commit -m 'Format Solana Campaign stack hotfix'
          git push origin HEAD:hotfix/solana-mainnet-transaction-normalization
