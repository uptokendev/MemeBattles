name: Remove one-shot Solana create stage markers

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/solana-remove-create-stage-markers-once.yml

permissions:
  contents: write

jobs:
  clean-source:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-phase0-refresh
          fetch-depth: 0

      - name: Remove temporary create-handler stage markers
        shell: python
        run: |
          from pathlib import Path

          path = Path('programs/memewarzone_solana/src/authorized_create.rs')
          source = path.read_text(encoding='utf-8')
          marker = 'msg!("MW_CREATE_STAGE_'
          count = source.count(marker)
          if count != 10:
              raise SystemExit(f'Expected exactly 10 temporary stage markers, found {count}')

          lines = source.splitlines(keepends=True)
          cleaned = ''.join(line for line in lines if marker not in line)
          if marker in cleaned:
              raise SystemExit('A temporary stage marker remained after cleanup')
          path.write_text(cleaned, encoding='utf-8')

      - name: Format and verify cleanup
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          if grep -R "MW_CREATE_STAGE_" programs/memewarzone_solana/src; then
            echo 'Temporary stage markers remain' >&2
            exit 1
          fi
          git diff -- programs/memewarzone_solana/src/authorized_create.rs

      - name: Commit clean source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/memewarzone_solana/src/authorized_create.rs
          git commit -m 'Remove temporary Solana create stage markers'
          git push origin HEAD:agent/solana-v2-phase0-refresh
