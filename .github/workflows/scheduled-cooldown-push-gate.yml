name: Scheduled cooldown push deployment gate

on:
  push:
    branches:
      - main
    paths:
      - .github/deployment-gates/scheduled-cooldown-v1.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: scheduled-cooldown-factory-bsc-testnet
  cancel-in-progress: false

jobs:
  deploy-verify-publish:
    name: deploy, verify and publish BSC Testnet replacement
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      BSC_TESTNET_RPC: ${{ secrets.BSC_TESTNET_RPC }}
      BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
      DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
      PRIVATE_KEY_DEPLOY: ${{ secrets.PRIVATE_KEY_DEPLOY }}
      ACTIVE_SCHEDULED_FACTORY_ADDRESS: 0xF7872169265eCE4E4C93ef894F1635E84DC6F681
      QA_CREATOR_ADDRESS: 0x13ad79765e14927df2c554d9662bbe539e89c8e8

    steps:
      - name: Validate exact approved pull request
        shell: bash
        run: |
          PR_JSON="$(gh api repos/${GITHUB_REPOSITORY}/pulls/71)"
          HEAD_REF="$(printf '%s' "$PR_JSON" | jq -r '.head.ref')"
          HEAD_REPO="$(printf '%s' "$PR_JSON" | jq -r '.head.repo.full_name')"
          BASE_REF="$(printf '%s' "$PR_JSON" | jq -r '.base.ref')"
          STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.draft')"
          test "$HEAD_REF" = "agent/fix-scheduled-cooldown-timezone"
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_REF" = "devpostgrad"
          test "$STATE" = "open"
          test "$DRAFT" = "true"

      - name: Announce protected deployment run
        run: |
          gh pr comment 71 --repo "$GITHUB_REPOSITORY" --body "Scheduled cooldown factory deployment started. Protected run ID: $GITHUB_RUN_ID. No contract transaction is sent before source compilation, targeted tests, size checks, exact-branch validation, and duplicate-deployment guards pass."

      - name: Checkout exact approved branch
        uses: actions/checkout@v4
        with:
          repository: uptokendev/MemeBattles
          ref: agent/fix-scheduled-cooldown-timezone
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            realtime-indexer/package-lock.json

      - name: Verify BSC Testnet deployment credentials
        shell: bash
        run: |
          if [ -z "${BSC_TESTNET_RPC}${BSC_TESTNET_RPC_URL}" ]; then
            echo "Missing BSC_TESTNET_RPC or BSC_TESTNET_RPC_URL secret."
            exit 1
          fi
          if [ -z "${DEPLOYER_PK}${PRIVATE_KEY_DEPLOY}" ]; then
            echo "Missing DEPLOYER_PK or PRIVATE_KEY_DEPLOY secret."
            exit 1
          fi

      - name: Prepare duplicate-safe deployment source
        run: |
          node --check scripts/prepare-scheduled-cooldown-deployment.mjs
          node scripts/prepare-scheduled-cooldown-deployment.mjs

      - name: Install and verify contract source
        run: |
          npm ci --no-audit --no-fund
          npm run compile
          npx hardhat test test/LaunchFactory.spec.ts
          npm run size

      - name: Deploy and activate factory-only replacement
        id: deploy
        run: npx hardhat run scripts/deploy-scheduled-cooldown-factory.ts --network bscTestnet

      - name: Sync frontend ABI
        run: npm run sync:frontend-abis

      - name: Publish active contract addresses immediately
        id: publish
        shell: bash
        run: |
          git fetch origin devpostgrad --depth=1
          git checkout origin/devpostgrad -- frontend/yarn.lock 2>/dev/null || true
          rm -f scripts/prepare-scheduled-cooldown-deployment.mjs
          rm -f frontend/src/__trigger-scheduled-cooldown-deployment.ts
          git diff --check
          git config user.name "MemeWarzone Deployment Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Deployment produced no repository changes."
            exit 1
          fi
          git commit -m "Activate scheduled cooldown factory on BSC Testnet"
          git push origin HEAD:agent/fix-scheduled-cooldown-timezone

      - name: Validate API and frontend against active replacement
        run: |
          node --check frontend/api/dev-fix/security.js
          node --check frontend/api/dev-fix/draft-deploy-base.js
          node --check frontend/api/dev-fix/draft-deploy.js
          npm ci --prefix frontend --no-audit --no-fund
          npm --prefix frontend run check:api-imports
          npm --prefix frontend run test:wallet-discovery
          npm --prefix frontend run build

      - name: Validate realtime indexer against active replacement
        run: |
          npm ci --prefix realtime-indexer --no-audit --no-fund
          npm --prefix realtime-indexer run build

      - name: Comment successful deployment details
        if: success()
        shell: bash
        run: |
          FACTORY="$(node -p "require('./deployments/bscTestnet.scheduled-cooldown-factory.json').activeFactory.address")"
          LOCKER="$(node -p "require('./deployments/bscTestnet.scheduled-cooldown-factory.json').activeFactory.permanentLpLocker")"
          TX="$(node -p "require('./deployments/bscTestnet.scheduled-cooldown-factory.json').deploymentTxHash")"
          BLOCK="$(node -p "require('./deployments/bscTestnet.scheduled-cooldown-factory.json').deploymentBlock")"
          gh pr comment 71 --repo "$GITHUB_REPOSITORY" --body "Scheduled cooldown factory deployment completed successfully. Factory: \`$FACTORY\`. Permanent LP locker: \`$LOCKER\`. Deployment transaction: \`$TX\`. Deployment block: \`$BLOCK\`. The old factory is creation-paused while its existing campaign remains supported. Run ID: $GITHUB_RUN_ID."

      - name: Comment deployment failure
        if: failure()
        run: |
          gh pr comment 71 --repo "$GITHUB_REPOSITORY" --body "Scheduled cooldown factory deployment failed before the full acceptance gate completed. Protected run ID: $GITHUB_RUN_ID. The duplicate guard prevents a second factory replacement if activation already occurred; inspect this run before retrying."
