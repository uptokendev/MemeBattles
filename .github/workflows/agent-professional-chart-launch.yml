          # -----------------------------------------------------------------
          replace_once(
              "frontend/src/components/token/ContinuousMarketChartPanel.tsx",
              '  const [denomination, setDenomination] = useState<UnifiedChartDenomination>("USD");\n  const solana = isSolanaChainId(chainId);',
              '  const [denomination, setDenomination] = useState<UnifiedChartDenomination>("USD");\n  const [chartExpanded, setChartExpanded] = useState(false);\n  const solana = isSolanaChainId(chainId);',
          )
          replace_once(
              "frontend/src/components/token/ContinuousMarketChartPanel.tsx",
              '    <div className={className ?? "flex h-full min-h-[220px] w-full flex-col"}>',
              '    <div className={`${className ?? "flex h-full min-h-[220px] w-full flex-col"} ${chartExpanded ? "!h-auto !min-h-[560px] md:!min-h-[640px]" : ""}`}>',
          )
          replace_once(
              "frontend/src/components/token/ContinuousMarketChartPanel.tsx",
              '          marketState={market.unifiedMarket.state}\n          graduationMarker={market.unifiedMarket.graduationMarker}',
              '          marketState={market.unifiedMarket.state}\n          serverTime={market.unifiedMarket.serverTime}\n          graduationMarker={market.unifiedMarket.graduationMarker}',
          )
          replace_once(
              "frontend/src/components/token/ContinuousMarketChartPanel.tsx",
              '          marketKey={`${chainId}:${campaignAddress || tokenAddress || ""}`}\n        />',
              '          marketKey={`${chainId}:${campaignAddress || tokenAddress || ""}`}\n          expanded={chartExpanded}\n          onExpandedChange={setChartExpanded}\n        />',
          )

          replace_once(
              "frontend/src/pages/TokenDetails.tsx",
              '  const [marketResolution, setMarketResolution] = useState<MarketResolution>("1m");\n  const [topazSlippageBps, setTopazSlippageBps] = useState(100);',
