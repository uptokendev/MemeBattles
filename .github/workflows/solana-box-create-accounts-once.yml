name: Apply one-shot Solana create account boxing fix

on:
  pull_request:
    branches:
      - devpostgrad
    paths:
      - .github/workflows/solana-box-create-accounts-once.yml

permissions:
  contents: write

jobs:
  patch-source:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-phase0-refresh
          fetch-depth: 0

      - name: Heap-box large create accounts and borrow arguments
        shell: python
        run: |
          from pathlib import Path

          create_path = Path('programs/memewarzone_solana/src/authorized_create.rs')
          source = create_path.read_text(encoding='utf-8')

          replacements = {
              "pub global_config: Account<'info, GlobalConfig>,":
                  "pub global_config: Box<Account<'info, GlobalConfig>>,",
              "pub generation_config: Account<'info, GenerationConfig>,":
                  "pub generation_config: Box<Account<'info, GenerationConfig>>,",
              "pub creator_profile: Account<'info, CreatorProfile>,":
                  "pub creator_profile: Box<Account<'info, CreatorProfile>>,",
              "pub risk_profile: Account<'info, RiskProfile>,":
                  "pub risk_profile: Box<Account<'info, RiskProfile>>,",
              "pub cluster_profile: Account<'info, ClusterProfile>,":
                  "pub cluster_profile: Box<Account<'info, ClusterProfile>>,",
              "pub campaign: Account<'info, Campaign>,":
                  "pub campaign: Box<Account<'info, Campaign>>,",
              "pub mint: Account<'info, Mint>,":
                  "pub mint: Box<Account<'info, Mint>>,",
              "pub token_vault: Account<'info, TokenAccount>,":
                  "pub token_vault: Box<Account<'info, TokenAccount>>,",
              "pub sol_vault: Account<'info, CampaignSolVault>,":
                  "pub sol_vault: Box<Account<'info, CampaignSolVault>>,",
              "pub create_authorization: Account<'info, CreateAuthorization>,":
                  "pub create_authorization: Box<Account<'info, CreateAuthorization>>,",
          }

          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(
                      f'Expected exactly one account declaration {old!r}; found {source.count(old)}'
                  )
              source = source.replace(old, new, 1)

          old_handler = '''pub fn create_campaign_handler(
              ctx: &mut Context<CreateCampaign>,
              args: CreateCampaignArgs,
          ) -> Result<()> {'''
          new_handler = '''pub fn create_campaign_handler(
              ctx: &mut Context<CreateCampaign>,
              args: &CreateCampaignArgs,
          ) -> Result<()> {'''
          if source.count(old_handler) != 1:
              raise SystemExit(
                  f'Expected one owned-args create handler, found {source.count(old_handler)}'
              )
          source = source.replace(old_handler, new_handler, 1)
          create_path.write_text(source, encoding='utf-8')

          lib_path = Path('programs/memewarzone_solana/src/lib.rs')
          lib_source = lib_path.read_text(encoding='utf-8')
          old_call = 'authorized_create::create_campaign_handler(&mut ctx, args)'
          new_call = 'authorized_create::create_campaign_handler(&mut ctx, &args)'
          if lib_source.count(old_call) != 1:
              raise SystemExit(
                  f'Expected one owned-args helper call, found {lib_source.count(old_call)}'
              )
          lib_source = lib_source.replace(old_call, new_call, 1)
          lib_path.write_text(lib_source, encoding='utf-8')

      - name: Format and verify patch
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          git diff -- \
            programs/memewarzone_solana/src/authorized_create.rs \
            programs/memewarzone_solana/src/lib.rs

      - name: Commit boxed create accounts
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            programs/memewarzone_solana/src/authorized_create.rs \
            programs/memewarzone_solana/src/lib.rs
          git commit -m 'Box large Solana create accounts'
          git push origin HEAD:agent/solana-v2-phase0-refresh
