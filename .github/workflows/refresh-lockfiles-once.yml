name: Refresh stale npm lockfiles once

on:
  push:
    branches:
      - agent/pump-style-candle-stabilization

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/pump-style-candle-stabilization
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh root lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh frontend lockfile only
        run: npm install --prefix frontend --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfiles if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json frontend/package-lock.json; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json frontend/package-lock.json
          git commit -m "Synchronize npm lockfiles for CI"
          git push origin HEAD:agent/pump-style-candle-stabilization
