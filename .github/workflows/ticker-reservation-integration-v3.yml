name: Ticker Reservation Integration V3

on:
  pull_request:
    branches:
      - agent/scheduled-launch-lifecycle
    paths:
      - .github/workflows/ticker-reservation-integration-v3.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-ticker-reservations
          fetch-depth: 0

      - name: Execute reviewed V2 integration with archive fix
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/ticker-reservation-integration-v2.yml').read_text(encoding='utf-8')
          start_marker = '''      - name: Patch canonical reservation lifecycle
                  shell: python
                  run: |
          '''
          end_marker = '''
                - name: Verify integration source
          '''
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])

          old_archive = dedent('''\
          archive_marker = 'Draft archived by creator; ticker returned to the chain availability pool.'
          if archive_marker not in drafts:
              old = dedent('''\\
                await pool.query("update campaign_drafts set status = 'archived', archived_at = now(), updated_at = now() where id::text = $1", [id]);
                const updated = await getDraftBundleById(id, "", { bypassVisibility: true });''')
              new = dedent('''\\
                try {
                  await withTickerReservationTransaction(pool, async (db) => {
                    await db.query("update campaign_drafts set status = 'archived', archived_at = now(), updated_at = now() where id::text = $1", [id]);
                    await releaseTickerReservation(db, {
                      draftId: id,
                      creatorWallet: row.creator_wallet,
                      reason: "Draft archived by creator; ticker returned to the chain availability pool.",
                    });
                  });
                } catch (error) {
                  if (error instanceof TickerReservationError || isTickerReservationConflict(error)) {
                    return json(res, error.httpStatus || 409, { error: error.message, code: error.code });
                  }
                  throw error;
                }
                const updated = await getDraftBundleById(id, "", { bypassVisibility: true });''')
              drafts = replace_once(drafts, old, new, 'archive reservation release')
          ''')

          new_archive = dedent('''\
          archive_marker = 'Draft archived by creator; ticker returned to the chain availability pool.'
          if archive_marker not in drafts:
              archive_start = drafts.index('  await pool.query("update campaign_drafts set status = \'archived\', archived_at = now(), updated_at = now() where id::text = $1", [id]);')
              archive_end_marker = '  const updated = await getDraftBundleById(id, "", { bypassVisibility: true });'
              archive_end = drafts.index(archive_end_marker, archive_start) + len(archive_end_marker)
              archive_replacement = dedent('''\\
              try {
                await withTickerReservationTransaction(pool, async (db) => {
                  await db.query("update campaign_drafts set status = 'archived', archived_at = now(), updated_at = now() where id::text = $1", [id]);
                  await releaseTickerReservation(db, {
                    draftId: id,
                    creatorWallet: row.creator_wallet,
                    reason: "Draft archived by creator; ticker returned to the chain availability pool.",
                  });
                });
              } catch (error) {
                if (error instanceof TickerReservationError || isTickerReservationConflict(error)) {
                  return json(res, error.httpStatus || 409, { error: error.message, code: error.code });
                }
                throw error;
              }
              const updated = await getDraftBundleById(id, "", { bypassVisibility: true });''')
              archive_replacement = '\\n'.join('  ' + line if line else '' for line in archive_replacement.splitlines())
              drafts = drafts[:archive_start] + archive_replacement + drafts[archive_end:]
          ''')

          if old_archive not in script:
              raise SystemExit('Could not locate the V2 archive patch block.')
          script = script.replace(old_archive, new_archive, 1)
          exec(compile(script, 'ticker-reservation-integration-v3', 'exec'), {})

      - name: Verify integration source
        shell: bash
        run: |
          node --check frontend/api/dev-fix/ticker-reservation-service.js
          node --check frontend/api/dev-fix/ticker-availability.js
          node --check frontend/api/dev-fix/drafts-base.js
          node --check frontend/api/dev-fix/drafts.js
          node --check frontend/api/dev-fix/draft-deploy-base.js
          git diff --check
          git diff --stat

      - name: Commit integration source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/api/dev-fix/ticker-reservation-service.js \
            frontend/api/dev-fix/drafts-base.js \
            frontend/api/dev-fix/drafts.js \
            frontend/api/dev-fix/draft-deploy-base.js
          if ! git diff --cached --quiet; then
            git commit -m 'Wire canonical ticker reservation lifecycle'
            git push origin HEAD:agent/solana-v2-ticker-reservations
          fi
