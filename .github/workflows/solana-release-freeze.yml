name: Solana release-freeze dual clean-room SBF

# Two independent runners, no cargo cache. Same SHA256 or the freeze fails.
# This is the Sunday freeze from finalpush.md. It does not replace Gate K/S/O.

on:
  workflow_dispatch:
  push:
    branches:
      - "hotfix/solana-*"
    paths:
      - programs/memewarzone_solana/**
      - Anchor.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/solana-release-freeze.yml
  pull_request:
    branches:
      - main
    paths:
      - programs/memewarzone_solana/**
      - Anchor.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/solana-release-freeze.yml

permissions:
  contents: read

concurrency:
  group: solana-release-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANCHOR_VERSION: 0.30.1
  SOLANA_VERSION: 1.18.26
  RUST_TOOLCHAIN: 1.79.0
  IDL_RUST_TOOLCHAIN: nightly-2024-05-09
  CARGO_NET_RETRY: 10
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  CARGO_INCREMENTAL: "0"

jobs:
  clean-room:
    name: Freeze room ${{ matrix.room }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        room: [A, B]
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install frozen Solana build CLI
        run: |
          set -euo pipefail
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"

      - name: Clean-room SBF + IDL
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          test ! -d target
          rm -rf "$HOME/.cargo/registry/src" || true
          CARGO_TARGET_DIR="$RUNNER_TEMP/mwz-freeze-${{ matrix.room }}" \
            anchor build --program-name memewarzone_solana --no-idl
          so="$(find "$RUNNER_TEMP/mwz-freeze-${{ matrix.room }}" -name memewarzone_solana.so -type f | head -n 1)"
          test -s "$so"
          mkdir -p target/idl target/deploy
          cp "$so" target/deploy/memewarzone_solana.so
          (
            cd programs/memewarzone_solana
            RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build \
              --out ../../target/idl/memewarzone_solana.json
          )
          test -s target/idl/memewarzone_solana.json
          so_sha="$(sha256sum target/deploy/memewarzone_solana.so | awk '{print $1}')"
          idl_sha="$(sha256sum target/idl/memewarzone_solana.json | awk '{print $1}')"
          meteora_sha="$(python -c 'import json; print(json.load(open("config/solana/meteora-cp-amm.certification.json"))["artifact"]["sha256"])')"
          migrations_sha="$(find db/migrations -type f -name '*.sql' | sort | xargs sha256sum | sha256sum | awk '{print $1}')"
          python - <<PY
          import json, os, subprocess
          from pathlib import Path

          def ver(cmd):
              return subprocess.check_output(cmd, text=True).strip().splitlines()[0]

          record = {
              "room": "${{ matrix.room }}",
              "gitSha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "programId": os.environ["PROGRAM_ID"],
              "sbfSha256": "$so_sha",
              "sbfBytes": Path("target/deploy/memewarzone_solana.so").stat().st_size,
              "idlSha256": "$idl_sha",
              "meteoraCpAmmSha256": "$meteora_sha",
              "migrationsSha256": "$migrations_sha",
              "rustc": ver(["rustc", "--version"]),
              "cargo": ver(["cargo", "--version"]),
              "solana": ver(["solana", "--version"]),
              "anchor": ver(["anchor", "--version"]),
              "node": ver(["node", "--version"]),
              "rustToolchain": os.environ["RUST_TOOLCHAIN"],
              "idlRustToolchain": os.environ["IDL_RUST_TOOLCHAIN"],
              "solanaVersion": os.environ["SOLANA_VERSION"],
              "anchorVersion": os.environ["ANCHOR_VERSION"],
          }
          Path("freeze-record.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          PY
          echo "sha256=$so_sha" >> "$GITHUB_OUTPUT"
          echo "idl=$idl_sha" >> "$GITHUB_OUTPUT"
          mkdir -p freeze-upload
          cp freeze-record.json freeze-upload/freeze-record.json
          cp target/deploy/memewarzone_solana.so freeze-upload/memewarzone_solana.so
          cp target/idl/memewarzone_solana.json freeze-upload/memewarzone_solana.json

      - name: Upload freeze room ${{ matrix.room }}
        uses: actions/upload-artifact@v4
        with:
          name: freeze-room-${{ matrix.room }}
          if-no-files-found: error
          path: freeze-upload/

  compare:
    name: Identical SHA256 across freeze rooms
    runs-on: ubuntu-latest
    needs: [clean-room]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freeze-room-A
          path: room-A
      - uses: actions/download-artifact@v4
        with:
          name: freeze-room-B
          path: room-B
      - name: Compare SBF, IDL, and recorded toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo '--- freeze room A ---'
          cat room-A/freeze-record.json
          echo '--- freeze room B ---'
          cat room-B/freeze-record.json
          sha256sum room-A/memewarzone_solana.so room-B/memewarzone_solana.so
          cmp -s room-A/memewarzone_solana.so room-B/memewarzone_solana.so
          cmp -s room-A/memewarzone_solana.json room-B/memewarzone_solana.json
          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(Path("room-A/freeze-record.json").read_text())
          b = json.loads(Path("room-B/freeze-record.json").read_text())
          keys = [
              "gitSha",
              "sbfSha256",
              "sbfBytes",
              "idlSha256",
              "meteoraCpAmmSha256",
              "migrationsSha256",
              "rustToolchain",
              "idlRustToolchain",
              "solanaVersion",
              "anchorVersion",
          ]
          mismatches = [k for k in keys if a.get(k) != b.get(k)]
          if mismatches:
              raise SystemExit("freeze mismatch: " + ", ".join(mismatches))
          print("CLEAN_ROOM_SBF_SHA256_MATCH=true")
          print("gitSha", a["gitSha"])
          print("sbfSha256", a["sbfSha256"])
          print("idlSha256", a["idlSha256"])
          PY
