name: Apply one-shot Solana source fix

on:
  push:
    branches:
      - agent/solana-v2-phase0-refresh
    paths:
      - .github/workflows/solana-source-fix-once.yml

permissions:
  contents: write

jobs:
  patch-source:
    if: github.repository == 'uptokendev/MemeBattles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/solana-v2-phase0-refresh
          fetch-depth: 0

      - name: Apply exact source replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path("programs/memewarzone_solana/src/authorized_create.rs")
          source = path.read_text(encoding="utf-8")

          old_handler = """pub fn create_campaign_handler(
              mut ctx: Context<CreateCampaign>,
          """
          new_handler = """pub fn create_campaign_handler(
              ctx: Context<CreateCampaign>,
          """
          if source.count(old_handler) != 1:
              raise SystemExit("Expected exactly one mutable create handler signature")
          source = source.replace(old_handler, new_handler, 1)

          fresh_generation = """test_generation(
                      [8; 32],
                      generation_key,
                      CLUSTER_KIND_DEVNET,
                      GRADUATION_TIER_ALL_MASK,
                  )"""

          first_move = "        let mut changed_generation = generation;\n"
          second_move = "        changed_generation = generation;\n"
          if source.count(first_move) != 1 or source.count(second_move) != 1:
              raise SystemExit("Expected exactly one pair of moved GenerationConfig test assignments")

          source = source.replace(
              first_move,
              f"        let mut changed_generation = {fresh_generation};\n",
              1,
          )
          source = source.replace(
              second_move,
              f"        let mut changed_generation = {fresh_generation};\n",
              1,
          )

          path.write_text(source, encoding="utf-8")

      - name: Format and verify patch
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          git diff -- programs/memewarzone_solana/src/authorized_create.rs

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/memewarzone_solana/src/authorized_create.rs
          git commit -m "Fix Solana IDL test ownership"
          git push origin HEAD:agent/solana-v2-phase0-refresh
