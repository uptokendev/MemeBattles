name: Apply Solana Preflight Final Patch PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-solana-preflight-final-pr.yml
      - .github/scripts/apply-solana-preflight-final.py
      - .github/solana-preflight-final-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/solana-final-launch-blockers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solana-final-launch-blockers
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply preflight-first architecture patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-solana-preflight-final.py

      - name: Validate patched surfaces
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check frontend/api/dev-fix/solana-trade-authorization-v1.js
          node --test frontend/api/dev-fix/solana-trade-preflight-final.test.mjs
          cargo fmt --all -- --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MemeWarzone Launch Bot"
          git config user.email "launch-bot@users.noreply.github.com"
          git add \
            frontend/api/dev-fix/solana-trade-authorization-v1.js \
            frontend/api/dev-fix/solana-trade-preflight-final.test.mjs \
            frontend/src/lib/solanaTradeV1.ts \
            frontend/src/lib/solanaV4CreateSubmit.ts \
            programs/memewarzone_solana/src/authorized_trade.rs \
            tests/solana/v4-lifecycle-acceptance.cjs
          if git diff --cached --quiet; then
            echo "Patch already applied; nothing to commit."
            exit 0
          fi
          git commit -m "Move Solana trade policy to signed preflight"
          git push origin HEAD:agent/solana-final-launch-blockers
