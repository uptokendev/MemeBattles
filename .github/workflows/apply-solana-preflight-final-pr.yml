name: Apply Solana Preflight Final Patch PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-solana-preflight-final-pr.yml
      - .github/workflows/apply-solana-preflight-final.yml
      - .github/solana-preflight-final-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/solana-final-launch-blockers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solana-final-launch-blockers
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract and run patch body
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-solana-preflight-final.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply preflight-first launch patch'
          start = source.index(marker)
          run_index = next(i for i in range(start + 1, len(source)) if source[i] == '        run: |')
          body = []
          for line in source[run_index + 1:]:
              if line.startswith('      - name: ') or line.startswith('      - uses: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise SystemExit(f'unexpected workflow indentation while extracting patch: {line!r}')
          if not body:
              raise SystemExit('patch body was empty')
          Path('/tmp/apply-solana-preflight-final.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python /tmp/apply-solana-preflight-final.py

      - name: Validate patched surfaces
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check frontend/api/dev-fix/solana-trade-authorization-v1.js
          node --test frontend/api/dev-fix/solana-trade-preflight-final.test.mjs
          cargo fmt --all -- --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MemeWarzone Launch Bot"
          git config user.email "launch-bot@users.noreply.github.com"
          git add \
            frontend/api/dev-fix/solana-trade-authorization-v1.js \
            frontend/api/dev-fix/solana-trade-preflight-final.test.mjs \
            frontend/src/lib/solanaTradeV1.ts \
            frontend/src/lib/solanaV4CreateSubmit.ts \
            programs/memewarzone_solana/src/authorized_trade.rs \
            tests/solana/v4-lifecycle-acceptance.cjs
          if git diff --cached --quiet; then
            echo "Patch already applied; nothing to commit."
            exit 0
          fi
          git commit -m "Move Solana trade policy to signed preflight"
          git push origin HEAD:agent/solana-final-launch-blockers
